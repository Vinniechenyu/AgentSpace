function showImportWizard(){const d=importDraft,a=asset(d.assetId);let body=`<div class="wizardsteps"><span class="${d.step===1?'on':''}">① 选择资产</span><span>→</span><span class="${d.step===2?'on':''}">② 安装配置</span><span>→</span><span class="${d.step===3?'on':''}">③ 确认导入</span></div><div class="ac-import-source"><span class="ac-mark">A</span><div class="grow"><b>AgentCenter</b><small>固定来源 · 内部平台</small></div>${tag('仅支持此来源','green')}</div>`;
 if(d.step===1)body+=`<div class="ac-picker-controls"><input id="importQuery" aria-label="搜索 AgentCenter 资产" placeholder="在 AgentCenter 中查找 MCP、CLI、Skill" value="${esc(d.query)}"><select id="importType"><option value="all">全部类型</option>${['MCP','CLI','Skill'].map(t=>`<option ${d.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div id="importPicker" class="ac-picker">${importPickerResults()}</div><p class="tiny muted">本地演示使用 AgentCenter 资产样例；此处不连接内部平台。</p>`;
 else if(d.step===2)body+=`<div class="ac-selected"><span class="ext-icon ${a.type.toLowerCase()}">${ico(a.icon)}</span><div class="grow"><b>${esc(a.name)}</b><small>${a.publisher}</small></div>${extensionTypeTag(a.type)}</div><label class="field">安装版本<select id="importVersion">${a.versions.map(v=>`<option ${d.version===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">生效范围</label><div class="scope-options"><label class="scope-choice ${d.scope==='global'?'selected':''}"><input type="radio" name="importScope" value="global" ${d.scope==='global'?'checked':''}>${ico('personal')}<span><b>全局</b><small>个人空间及项目均可使用</small></span></label><label class="scope-choice ${d.scope==='project'?'selected':''}"><input type="radio" name="importScope" value="project" ${d.scope==='project'?'checked':''}>${ico('team')}<span><b>指定项目</b><small>仅在所选项目中使用</small></span></label></div><div id="importProjectField" ${d.scope==='global'?'hidden':''}><label class="field">选择项目<select id="importProject">${projectNames.map(p=>`<option ${d.project===p?'selected':''}>${esc(p)}</option>`).join('')}</select></label></div><div class="note" style="font-size:11px;margin-top:18px">能力与权限：${a.permissions.join('、')}。安装保存可用配置，实际调用按任务授权执行。</div>`;
 else{const existing=s.installations.find(i=>i.assetId===a.id&&i.scope===d.scope&&(d.scope==='global'||i.project===d.project));body+=`<div class="ac-confirm"><span class="ext-icon ${a.type.toLowerCase()}">${ico(a.icon)}</span><h3>${esc(a.name)}</h3><p>${a.desc}</p></div><div class="ac-summary"><div><span>资产类型</span><b>${a.type}</b></div><div><span>导入来源</span><b>AgentCenter</b></div><div><span>安装版本</span><b>v${d.version}</b></div><div><span>生效范围</span><b>${d.scope==='global'?'全局':esc(d.project)+' 项目'}</b></div><div><span>授权要求</span><b>${a.permissions.join(' / ')}</b></div></div><div class="note" style="font-size:11px;margin-top:17px">${existing?`此范围已有安装：v${existing.version}。确认后更新同一项安装，不重复创建。`:d.scope==='project'?'仅所选项目可见并可用；其他项目不受影响。项目版本优先于已启用的全局版本。':'个人空间和项目可使用该扩展；项目如另有已启用的版本，优先使用项目版本。'}</div>`;}
 modal('从 AgentCenter 导入',body,`<span class="tiny muted">${d.step===1?'唯一来源：AgentCenter':'安装信息保存在当前演示中'}</span><div class="row">${d.step>1?btn('上一步','ext-import-back'):btn('取消','close-modal')}${d.step===2?btn('下一步：确认导入','ext-import-next','','primary'):d.step===3?btn('确认导入','ext-import-confirm','','primary'):''}</div>`);}
function captureImportConfig(){if($('#importVersion'))importDraft.version=$('#importVersion').value;if($('input[name="importScope"]:checked'))importDraft.scope=$('input[name="importScope"]:checked').value;if($('#importProject'))importDraft.project=$('#importProject').value;}
function commitImport(){const d=importDraft,a=asset(d?.assetId);if(!a||!a.versions.includes(d.version)||!['global','project'].includes(d.scope)||(d.scope==='project'&&!projectNames.includes(d.project))){notify('请从 AgentCenter 选择有效资产、版本与生效范围。');return;}
 let i=s.installations.find(i=>i.assetId===a.id&&i.scope===d.scope&&(d.scope==='global'||i.project===d.project));const duplicate=!!i;if(i){i.version=d.version;i.enabled=true;}else{s.installations.push({id:'I-'+Date.now(),assetId:a.id,version:d.version,source:'AgentCenter',scope:d.scope,project:d.scope==='project'?d.project:null,enabled:true,installedAt:'刚刚'});}s.view='extensions';s.extensionPage='installed';s.extensionType='all';s.extensionScope=d.scope==='global'?'global':d.project;s.extensionQuery='';s.wfTested=false;if(d.returnProject){s.view='team';s.project=d.returnProject;s.page='project';s.teamPage='project';s.projectTab='extensions';}closeModal();render();notify((duplicate?'已更新':'已导入')+' '+a.name+' · '+(d.scope==='global'?'全局生效':d.project+' 项目生效'));}
function installationDetail(id){const i=s.installations.find(x=>x.id===id);if(!i)return;const a=asset(i.assetId);modal('扩展详情与配置',`<div class="ac-selected"><span class="ext-icon ${a.type.toLowerCase()}">${ico(a.icon)}</span><div class="grow"><b>${esc(a.name)}</b><small>来源：AgentCenter · ${a.publisher}</small></div>${extensionTypeTag(a.type)}</div><p class="small muted">${a.desc}</p><label class="field">安装版本（来自 AgentCenter）<select id="detailVersion">${a.versions.map(v=>`<option ${v===i.version?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">安装范围<select id="detailScope"><option value="global" ${i.scope==='global'?'selected':''}>全局</option>${projectNames.map(p=>`<option value="${esc(p)}" ${i.scope==='project'&&i.project===p?'selected':''}>项目 · ${esc(p)}</option>`).join('')}</select></label><div class="ac-summary"><div><span>安装状态</span><b>${i.enabled?'已启用':'已停用'}</b></div><div><span>能力与权限</span><b>${a.permissions.join(' / ')}</b></div></div><p class="tiny muted" style="margin-top:17px">同一资产在同一范围只保留一项安装。版本选项与安装来源均由 AgentCenter 提供。</p>`,`${btn('关闭','close-modal')}${btn('保存配置','ext-save-config',id,'primary')}`);}
function extensionDependencies(){const ns=s.nodes.filter(n=>nodeExtensionType(n));modal('当前 Workflow 引用的扩展',`<div class="note" style="font-size:11px;margin-bottom:16px">使用范围：${s.buildScope==='global'?'全局':esc(s.buildScope)}。构建仅配置节点引用；扩展的安装与生效范围在“扩展”中管理。</div>${ns.map(n=>{const a=resolvedNodeAsset(n);return `<div class="sourceitem"><span class="sourcedot">${ico(NODE_ICON[n.type]||n.icon)}</span><div class="grow"><b>${esc(n.type)} · ${esc(n.label)}</b><small>${a?esc(a.name)+' · v'+a.installation.version+' · '+scopeLabel(a.installation):'当前范围没有匹配的已启用扩展'}</small></div>${tag(a?'可用':'待安装',a?'green':'gold')}</div>`;}).join('')||'<p class="small muted">当前流程尚未引用 MCP、CLI 或 Skill。</p>'}`,`${btn('回到流程','close-modal')}${btn('打开扩展','extensions','','primary')}`);}

 {id:'space-personal-ai',scope:'personal',project:null,name:'AI 研发研究',description:'收集 Agent、SDD 与研发模式的研究材料。',instructions:'优先引用空间中的资料，给出明确来源；推测与事实分开。',docs:[{id:'doc-p1',title:'Agent 研发观察笔记',kind:'note',content:'关注 Agent 的任务执行、上下文、验证与协作。每次研究记录来源、结论及待验证假设。',version:1,updated:'10月27日',source:'我的笔记'},{id:'doc-p2',title:'SDD 实践要点',kind:'document',content:'从需求目标、约束和验收标准出发，形成可消费的 Spec。执行中保留输入版本与验证证据。',version:1,updated:'10月26日',source:'个人整理'}],chats:[]},
 {id:'space-personal-work',scope:'personal',project:null,name:'我的工作资料',description:'个人常用规范、日报口径与分析材料。',instructions:'回答应结合已收录的工作口径。',docs:[{id:'doc-p3',title:'质量日报口径',kind:'document',content:'日报优先展示发布阻塞项、需求变化和待确认风险。每个风险需有责任人、来源证据和下一步动作。',version:1,updated:'10月27日',source:'工作笔记'}],chats:[]},
 ...projectNames.map((p,index)=>({id:'space-project-'+index,scope:'project',project:p,name:p+' 项目知识库',description:'团队共享的需求、设计、规范与长期知识。',instructions:'以项目已确认的需求与设计为准，引用资料并保留版本。',docs:[{id:'doc-'+index+'-spec',title:p+' 需求与验收规范',kind:'document',content:'需求应明确目标、范围、约束和验收条件；进入执行前由 Owner 确认。目标变化后需更新版本并重新验证相关产物。',version:2,updated:'10月27日',source:'项目规范'},{id:'doc-'+index+'-design',title:p+' 架构与仓库说明',kind:'document',content:'项目代码在独立分支与云端环境中执行。保存仓库、分支、输入快照与环境版本；产物以待审查 MR、测试报告和验收结论交付。',version:1,updated:'10月26日',source:'团队资料'},{id:'doc-'+index+'-qa',title:'质量验证检查表',kind:'note',content:'检查正常路径、空输入、并发、异常回退和兼容性。运行成功、验证通过与人工验收分别记录。',version:1,updated:'10月27日',source:'QA 团队'}],chats:[]}))
];}
function knowledgeSpace(id){return s.knowledgeSpaces.find(x=>x.id===id);}
function projectKnowledge(project=s.project){return s.knowledgeSpaces.find(x=>x.scope==='project'&&x.project===project);}
function contextSnapshot(ids){return ids.map(id=>knowledgeSpace(id)).filter(Boolean).map(sp=>({id:sp.id,name:sp.name,instructions:sp.instructions,documents:sp.docs.map(d=>({id:d.id,title:d.title,version:d.version}))}));}
function knowledgeSelection(project,selected=[]){const spaces=s.knowledgeSpaces.filter(sp=>project==='个人'?sp.scope==='personal':sp.scope==='project'&&sp.project===project);return spaces.length?`<div class="knowledge-options">${spaces.map(sp=>`<label><input name="taskKnowledge" type="checkbox" value="${sp.id}" ${selected.includes(sp.id)?'checked':''}><span>${ico('file')}<b>${esc(sp.name)}</b><small>${sp.docs.length} 份资料 · ${sp.scope==='personal'?'仅自己可见':'项目共享'}</small></span></label>`).join('')}</div>`:'<p class="small muted">当前范围暂无空间，可先添加知识资料。</p>';}
function activeSpace(){return s.view==='team'?projectKnowledge():knowledgeSpace(s.personalSpaceId);}
function renderPersonalSpaces(){if(s.personalSpaceId&&knowledgeSpace(s.personalSpaceId))return renderKnowledgeDetail(knowledgeSpace(s.personalSpaceId));const spaces=s.knowledgeSpaces.filter(x=>x.scope==='personal');return `<div class="demohead"><div><h1>个人知识库</h1><p>收录资料、记录思考，在知识库内提问；把需要的知识带进个人任务。</p></div>${btn(ico('plus')+'新建知识库','space-create','','primary')}</div><div class="knowledge-space-grid">${spaces.map(sp=>`<article class="knowledge-space-card"><span class="space-symbol">${ico('book')}</span><div class="row between"><h3>${esc(sp.name)}</h3>${tag('个人','gray')}</div><p>${esc(sp.description)}</p><div class="space-stats"><span>${sp.docs.length} 份资料</span><span>${sp.chats.length} 条问答</span><span>独立上下文</span></div>${btn('打开 '+ico('arrow'),'space-open',sp.id,'sm')}</article>`).join('')}</div><div class="note" style="margin-top:21px;font-size:11px">工作台呈现工作结果；知识库保存可反复使用的知识与上下文，内容按你的选择进入任务。</div>`;}
function renderKnowledgeDetail(sp){const project=sp.scope==='project',tab=s.spaceTab||'materials';return `<div class="space-detail"><div class="demohead"><div>${project?'':btn(ico('back')+'个人知识库','space-list','','link sm')}<div class="kicker">${project?'PROJECT KNOWLEDGE':'PERSONAL KNOWLEDGE'}</div><h1>${project?'项目知识库':esc(sp.name)}</h1><p>${esc(String(sp.description||'').replace(/[。.]$/,''))} · ${project?'项目成员共享':'仅自己可见'} · ${sp.docs.length} 份资料</p></div><div class="row wrap">${btn('在知识库中提问','space-tab','chat')}${btn(ico('plus')+'添加资料','space-add',sp.id,'primary')}</div></div><div class="dtabs">${[['materials','资料'],['chat','知识库问答'],['usage','使用记录'],['settings','知识库设置']].map(([v,l])=>`<button class="${tab===v?'active':''}" data-a="space-tab" data-v="${v}">${l}</button>`).join('')}</div>${tab==='chat'?renderSpaceChat(sp):tab==='usage'?renderSpaceUsage(sp):tab==='settings'?`<div class="card pad"><h3>空间说明与默认指引</h3><label class="field">空间名称<input id="spaceSettingName" value="${esc(sp.name)}"></label><label class="field">说明<textarea id="spaceSettingDescription" rows="2">${esc(sp.description)}</textarea></label><label class="field">Agent 使用知识时的默认指引<textarea id="spaceSettingInstructions" rows="4">${esc(sp.instructions)}</textarea></label><div class="row between"><span class="tiny muted">范围：${project?esc(sp.project)+' 项目成员':'个人'}</span>${btn('保存设置','space-save-settings',sp.id,'primary')}</div></div>`:`<div class="space-material-toolbar"><span class="small muted">资料可作为任务输入；产物经选择后也可沉淀到知识库。</span><input id="spaceSearch" placeholder="搜索资料名称或内容" aria-label="搜索空间资料" value="${esc(s.spaceQuery||'')}"></div><div id="spaceDocumentResults">${spaceDocumentResults(sp)}</div><div class="note" style="margin-top:18px;font-size:11px">${project?'本空间承载团队长期知识；执行产生的结果先进入“产物”，经选择后收录为知识。':'每个知识库有独立资料、指引与问答，创建任务时可选择具体知识范围。'}</div>`}</div>`;}
function spaceDocumentResults(sp){const q=(s.spaceQuery||'').toLowerCase(),docs=sp.docs.filter(d=>(d.title+d.content).toLowerCase().includes(q));return docs.length?`<div class="card space-documents">${docs.map(d=>`<div class="space-doc-row"><span class="doc-type-icon">${ico(d.kind==='link'?'link':d.kind==='note'?'spark':'file')}</span><div class="grow"><button class="space-doc-title" data-a="space-doc" data-v="${sp.id}|${d.id}">${esc(d.title)}</button><small>${esc(d.source)} · V${d.version} · ${d.updated}${d.originTask?' · 来自产物 '+d.originTask:''}</small></div>${tag(d.kind==='note'?'笔记':d.kind==='link'?'链接':'资料','gray')}${btn('查看','space-doc',sp.id+'|'+d.id,'link sm')}</div>`).join('')}</div>`:'<div class="empty">没有匹配资料。可以添加笔记、链接或文件。</div>';}
function renderSpaceChat(sp){return `<div class="space-chat"><div class="note" style="font-size:11px;margin-bottom:18px">本次问答使用 ${esc(sp.name)} 的 ${sp.docs.length} 份资料。回答可以回到引用来源。</div>${sp.chats.map(c=>`<div class="chatbubble mine"><small>我</small>${esc(c.question)}</div><div class="chatbubble"><small>空间助理 · 演示回答</small>${esc(c.answer)}<div class="space-citations">${c.refs.map(id=>{const d=sp.docs.find(x=>x.id===id);return d?btn(ico('file')+esc(d.title),'space-doc',sp.id+'|'+d.id,'link sm'):'';}).join('')}</div>${btn('带入任务','space-question-task',sp.id+'|'+c.id,'sm')}</div>`).join('')||'<div class="space-chat-empty"><span>'+ico('spark')+'</span><h3>围绕这份知识，继续想一步</h3><p>例如：按照空间内的规范，任务执行前需要确认哪些内容？</p></div>'}<div class="composer"><textarea id="spaceQuestion" placeholder="基于当前空间的资料提问…" aria-label="空间问题"></textarea><div class="composerfoot"><span>引用空间资料 · 保留来源</span>${btn(ico('send')+'提问','space-ask',sp.id,'primary')}</div></div></div>`;}
function renderSpaceUsage(sp){const tasks=s.tasks.filter(t=>(t.spaceIds||[]).includes(sp.id));return `<div class="note" style="font-size:11px;margin-bottom:18px">任务保存采用的空间与资料版本；后续知识更新不会改写已保存的输入快照。</div>${tasks.length?taskTable(tasks):'<div class="empty">暂无任务引用该空间。可在新建任务时选择知识范围。</div>'}`;}
function createSpace(){modal('新建个人空间',`<label class="field">空间名称<input id="newSpaceName" placeholder="例如：AI 研发研究"></label><label class="field">空间说明<textarea id="newSpaceDescription" rows="3" placeholder="准备在这里收集哪些资料、研究哪些问题？"></textarea></label><p class="tiny muted">个人空间默认仅自己可见。</p>`,`${btn('取消','close-modal')}${btn('创建空间','space-create-confirm','','primary')}`);}
function addSpaceDocument(id){modal('添加空间资料',`<div class="note" style="font-size:11px">收录到：${esc(knowledgeSpace(id).name)}</div><label class="field">资料类型<select id="spaceDocKind"><option value="note">笔记 / 文本资料</option><option value="link">文档链接</option><option value="file">上传文件</option></select></label><label class="field">资料标题<input id="spaceDocTitle" placeholder="输入资料名称"></label><div id="spaceDocTextField"><label class="field">内容<textarea id="spaceDocContent" rows="6" placeholder="写下知识内容或粘贴文档正文…"></textarea></label></div><div id="spaceDocLinkField" hidden><label class="field">链接地址<input id="spaceDocUrl" placeholder="https://…"></label><label class="field">链接摘要<textarea id="spaceDocSummary" rows="3" placeholder="说明这份文档的内容与用途"></textarea></label></div><div id="spaceDocFileField" hidden><label class="field">选择文件<input id="spaceDocFile" type="file"></label><p id="spaceFileNote" class="tiny muted">文本文件可预览内容，其他格式显示文件信息。</p></div>`,`${btn('取消','close-modal')}${btn('收录资料','space-add-confirm',id,'primary')}`);}
let selectedKnowledgeFile=null;
function viewSpaceDocument(ref){const [sid,did]=ref.split('|'),sp=knowledgeSpace(sid),d=sp?.docs.find(x=>x.id===did);if(!d)return;modal(esc(d.title),`<div class="row between">${tag(sp.scope==='project'?esc(sp.project)+' 项目':'个人','gray')}<small class="muted">V${d.version} · ${d.updated}</small></div><div class="document-preview">${esc(d.content||'已收录文件信息，正文尚未提供。').replace(/\n/g,'<br>')}</div>${d.url?`<p class="small muted" style="overflow-wrap:anywhere">链接：${esc(d.url)}</p>`:''}<p class="tiny muted">来源：${esc(d.source)}${d.originTask?' · '+d.originTask:''}</p>`,`${btn('关闭','close-modal')}${btn('编辑资料','space-doc-edit',ref,'primary')}`);}
function editSpaceDocument(ref){const [sid,did]=ref.split('|'),d=knowledgeSpace(sid).docs.find(x=>x.id===did);modal('编辑空间资料',`<label class="field">标题<input id="editDocTitle" value="${esc(d.title)}"></label><label class="field">内容<textarea id="editDocContent" rows="8">${esc(d.content)}</textarea></label><p class="tiny muted">保存为 V${d.version+1}；已运行任务仍保留旧版本快照。</p>`,`${btn('取消','close-modal')}${btn('保存新版本','space-doc-save',ref,'primary')}`);}
function attachSpaceContext(t){if(!Array.isArray(t.spaceIds))t.spaceIds=t.scope==='个人'?[]:[projectKnowledge(t.scope)?.id].filter(Boolean);if(!Array.isArray(t.knowledgeSnapshot))t.knowledgeSnapshot=contextSnapshot(t.spaceIds);}

function newBoardState(personal=false){return {tab:'runs',layout:'kanban',trigger:'all',automationId:null,project:'all',relation:personal?'related':'all',status:'all',ruleStatus:'all',query:'',collaborationMode:'all'};}
function isMyBoard(){return s.view==='personal'&&s.page==='tasks';}
function boardState(){const key=isMyBoard()?'personalBoard':'projectBoard';return s[key]||(s[key]=newBoardState(isMyBoard()));}
function joinedProjects(){return s.joinedProjects||projectNames;}
function isMe(name){return ['我','me','Liang','Liang Guo'].includes(name);}
function taskTrigger(t){return t.trigger||(t.type==='fixed'?'schedule':'manual');}
function taskTriggeredBy(t){return t.triggeredBy||(t.automationId?(taskTrigger(t)==='schedule'?'定时器':s.automations.find(a=>a.id===t.automationId)?.eventSource||'业务事件'):'未记录');}
function personallyRelatedTask(t){return t.scope==='个人'||joinedProjects().includes(t.scope)&&(isMe(t.owner)||isMe(taskTriggeredBy(t)));}
function personallyRelatedRule(a){return a.project==='个人'||joinedProjects().includes(a.project)&&(isMe(a.owner)||ruleTriggeredByMe(a));}
function ruleTriggeredByMe(a){return isMe(a.lastTriggeredBy)||!!a.id&&s.tasks.some(t=>t.automationId===a.id&&isMe(taskTriggeredBy(t)));}
function taskRelationLabel(t){const owner=isMe(t.owner),triggered=isMe(taskTriggeredBy(t));return owner&&triggered?'我负责 · 由我触发':owner?'我负责':triggered?'由我触发':'个人任务';}

function renderCollaborationTasks(){const tasks=collaborationTasks(),all=collaborationTasks(true),temporary=all.filter(t=>collaborationMode(t)==='temporary').length,workflow=all.length-temporary;return `<div class="collaboration-note"><span>${ico('chat')}</span><div><b>从一段讨论，到一次协作交付</b><p>临时协作通过 @Agent 处理一次性任务；Workflow 协作从 Thread 启动预制流程。每项任务都关联原线程、执行记录与产物。</p></div><div class="collaboration-totals"><span>临时 <b>${temporary}</b></span><span>Workflow <b>${workflow}</b></span></div></div><div class="board-controls"><span class="tiny muted">${tasks.length} 项协作任务 · 与运行看板共用同一任务记录</span>${btn('从线程发起协作','collaboration-new','','sm')}</div>${tasks.length?`<div class="collaboration-task-grid ac-grid">${tasks.map(t=>{return collaborationCard(t);const ref=collaborationThreadRef(t),th=projectThreadList(t.scope).find(th=>th.key===ref.key);return `<article class="collaboration-task-card" data-collaboration-id="${t.id}"><header><div class="row">${tag(collaborationLabel(t),collaborationMode(t)==='workflow'?'':'green')}${taskChip(t)}</div><small>${t.id}</small></header><div class="collaboration-origin-line">${taskProjectBadge(t)}<span># ${esc(ref.channel)}</span></div><button class="collaboration-task-title" data-a="open-task" data-v="${t.id}">${esc(t.title)}</button><p>${esc(t.goal)}</p><div class="collaboration-executor">${ico(collaborationMode(t)==='workflow'?'workflow':'spark')}<div><b>${esc(t.workflowName||t.executor||'CodeAgent')}${t.workflowVersion?' · v'+esc(t.workflowVersion):''}</b><small>${collaborationMode(t)==='workflow'?'按预制步骤推进 · 保留人工确认节点':'按话题目标执行 · 产物回到原 Thread'}</small></div></div><button class="collaboration-thread-link" data-a="collaboration-origin" data-v="${t.id}">${ico('chat')}<span>${esc(th?.title||'查看原始协作线程')}</span>${ico('arrow')}</button><div class="aggregate-task-people"><span>责任人 <b>${esc(t.owner)}</b>　·　发起人 <b>${esc(taskTriggeredBy(t))}</b></span></div><footer>${collaborationTaskActions(t)}</footer></article>`;}).join('')}</div>`:'<div class="aggregate-empty"><h3>当前筛选下暂无协作任务</h3><p>到线程中 @Agent 或启动 Workflow，任务会自动汇总到这里。</p>'+btn('查看项目线程','collaboration-new','','sm')+'</div>'}`;}
function openProjectThread(key,project=s.project,kind){if(s.channelMemberPanel)s.channelMemberPanel.open=false;const th=projectThreadList(project).find(t=>t.key===key);if(!th){notify('原线程暂不可用，请在项目线程列表中查找。');return;}const mode=kind||th.mode||'temp';s.project=project;s.view='team';s.page='channel';s.teamPage='channel';s.channel=th.channel;s.channelTab='messages';s.threadKind=mode;if(mode==='fixed')s.activeWorkflowThread=key;else s.activeTempThread=key;s.threadOpen=true;s.threadTab='discussion';closeModal();render();}

function renderProjectThreads(){return `${projectSectionHead('线程','汇总项目各频道中的具体话题，查看讨论与关联的执行任务。',btn(ico('plus')+'新建线程','new-thread','','link sm'))}<div class="project-thread-toolbar"><label>所属频道<select id="projectThreadChannel"><option value="all">全部频道</option>${projectChannels().map(c=>`<option value="${esc(c.id)}" ${s.projectThreadFilter.channel===c.id?'selected':''}># ${esc(c.name)}</option>`).join('')}</select></label><label class="grow">搜索线程<input id="projectThreadQuery" aria-label="搜索项目线程" value="${esc(s.projectThreadFilter.query)}" placeholder="搜索话题标题、内容…"></label>${btn('查看协作任务','project-collaboration','','sm')}</div><div class="project-thread-list pt-grid" id="projectThreadResults">${projectThreadRows()}</div>`;}
function renderProjectAgents(){return `${projectSectionHead('Agent','项目中的协作成员，承担分析、开发、测试与文档等工作。')}<div class="project-capability-grid">${projectAgentList().map(p=>`<article class="project-agent-card"><div class="row between"><span class="avatar ${p.tone}">${p.initial}</span>${tag('已接入','green')}</div><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p><div class="project-agent-role">${esc(p.name==='CodeAgent'?'代码分析、问题修复与开发任务':p.name==='QA Agent'?'验证、回归与测试证据整理':'报告、文档与交付材料整理')}</div><div class="project-agent-context">${ico('cloud')}项目授权 · 云端执行</div><footer>${btn('能力详情','project-agent-detail',p.id,'sm')}${btn('发消息','directory-message',p.id,'link sm')}</footer></article>`).join('')}</div><div class="note" style="margin-top:20px;font-size:11px">Agent 以协作身份参与任务；MCP、CLI、Skill 等能力在“扩展”中查看和安装。</div>`;}
function renderProjectExtensions(){const rows=effectiveInstallations(s.project).filter(i=>s.projectExtensionType==='all'||asset(i.assetId)?.type===s.projectExtensionType);return `${projectSectionHead('扩展','项目当前可用的 MCP、CLI、Skill，统一来自 AgentCenter。',btn(ico('plus')+'从 AgentCenter 导入','project-ext-import','','primary sm'))}<div class="project-extension-note">${ico('grid')}<span>全局安装在项目中继承可用；已启用的项目版本优先。这里展示实际生效的非 Agent 扩展。</span></div><div class="project-extension-filters">${['all','MCP','CLI','Skill'].map(type=>`<button class="${s.projectExtensionType===type?'active':''}" data-a="project-ext-type" data-v="${type}">${type==='all'?'全部扩展':type}</button>`).join('')}<span class="spacer"></span><small class="muted">${rows.length} 项可用</small></div><div class="extension-grid">${rows.map(i=>{const a=asset(i.assetId);return `<article class="extension-card"><div class="row between"><span class="ext-icon ${a.type.toLowerCase()}">${ico(a.icon)}</span>${extensionTypeTag(a.type)}</div><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p><div class="ext-meta"><span>${ico('shield')}AgentCenter</span><span>v${i.version}</span></div><div class="ext-scope">${tag(i.scope==='global'?'继承全局安装':'本项目安装',i.scope==='global'?'gray':'green')}<small>${esc(s.project)} 可用</small></div><div class="ext-card-foot">${btn('详情与配置','ext-detail',i.id,'sm')}</div></article>`;}).join('')||'<div class="empty">当前没有匹配的可用扩展，可从 AgentCenter 导入。</div>'}</div>`;}
function renderProjectMembers(){return `${projectSectionHead('成员与设置','项目成员、职责与协作范围。')}<div class="card pad">${[['我','项目参与者 · 任务跟进与协作'],['张三','项目 Owner · 目标确认与验收'],['李四','研发 · 需求澄清与代码检视'],['王五','QA · 测试确认与回归'],['陈工','架构 · 方案评审与技术协同'],['周工','软硬协同 · 现网风险复核']].map(([n,r])=>`<div class="sourceitem"><span class="avatar blue">${n[0]}</span><div class="grow"><b>${n}</b><small>${r}</small></div>${tag(n==='张三'?'Owner':'成员','gray')}</div>`).join('')}</div>`;}
function renderProjectOverview(){const tasks=s.tasks.filter(t=>t.scope===s.project),collab=tasks.filter(isCollaborationTask),threads=projectThreadList();return `<div class="project-overview-metrics">${[['频道',projectChannels().length,'channels','chat'],['线程',threads.length,'threads','chat'],['Agent',projectAgentList().length,'agents','spark'],['可用扩展',effectiveInstallations(s.project).length,'extensions','grid']].map(([l,n,tab,icon])=>`<button data-a="project-tab" data-v="${tab}">${ico(icon)}<b>${n}</b><span>${l}</span>${ico('arrow')}</button>`).join('')}</div><div class="grid2"><div class="card pad"><div class="row between"><h3>最近协作</h3>${btn('全部线程','project-tab','threads','link sm')}</div>${threads.slice(0,3).map(th=>`<button class="threadlink" data-a="project-thread-open" data-v="${esc(th.key)}"><b>${esc(th.title)}</b><small># ${esc(th.channel)} · ${th.tasks.length} 项协作任务</small></button>`).join('')}</div><div class="card pad"><div class="row between"><h3>交付与积累</h3>${btn('任务看板','task-board','','link sm')}</div><p class="small muted" style="margin:13px 0 18px">${tasks.length} 个任务实例 · ${collab.length} 项来自 Thread 的协作任务</p><div class="project-overview-links">${btn('协作任务','project-collaboration','','sm')}${btn('已绑定工作流','project-tab','workflows','sm')}${btn('项目知识库','project-tab','space','sm')}${btn('任务产物','project-tab','artifacts','sm')}</div><div class="rule"></div><p class="tiny muted">讨论进入任务，结果回到原线程；有复用价值的产物可收录到项目知识库。</p></div></div>`;}
function projectNewThread(mode='temp'){modal('新建项目线程',`<label class="field">话题标题<input id="newThreadTitle" placeholder="例如：排查当前版本的启动延迟"></label><label class="field">问题与目标<textarea id="newThreadText" rows="4" placeholder="写清背景、问题、约束与期望结果。"></textarea></label><div class="form-grid2"><label class="field">所在频道<select id="newThreadChannel">${projectChannels().map(c=>`<option value="${esc(c.id)}" ${c.id===(mode==='fixed'?'requirement':'development')?'selected':''}># ${esc(c.name)}</option>`).join('')}</select></label><label class="field">协作方式<select id="newThreadMode"><option value="temp" ${mode==='temp'?'selected':''}>临时协作 · @CodeAgent</option><option value="fixed" ${mode==='fixed'?'selected':''}>Workflow 协作 · SpecX</option></select></label></div><div class="note" style="font-size:11px">创建后先进入 Thread 讨论；确认执行目标或 Workflow 输入后生成协作任务。</div>`,`${btn('取消','close-modal')}${btn('创建线程','create-thread','','primary')}`);}
function activeThreadKey(kind=s.threadKind){return kind==='fixed'?s.activeWorkflowThread||'spec':s.activeTempThread||'perf';}
function threadTitle(){return customThread()?.title||(s.threadKind==='fixed'?'资源组优先策略：需求到交付':'任务列表变慢：从排障到修订验收');}
function renderThreadDiscussion(fixed,t){return coThreadDiscussion(fixed,t);}
function startSpec(){const custom=customThread();modal('从讨论整理 SpecX 输入',`<div class="note">来源：${esc(s.project)} / #${esc(currentThreadChannel())} / ${esc(threadTitle())}<br>流程：SpecX v1.4 · 项目授权环境 · Owner：张三</div><label class="field">目标<input id="specGoal" value="${esc(custom?.text||'指定资源组优先，无可用资源时按原策略兜底。')}"></label><label class="field">范围与约束<textarea id="specScope" rows="2">${esc(custom?'限定在本线程已讨论并确认的需求范围；引用本项目授权资料。':'aics-core 调度模块；保持旧客户端行为；不改变现有接口。')}</textarea></label><label class="field">验收条件<textarea id="specAccept" rows="3">${esc(custom?'规格、开发结果与测试证据满足本线程确认的目标；交付 Spec、MR 与测试报告。':'优先命中、资源为空、异常回退和旧客户端兼容用例通过；交付 Spec、待审查 MR 与测试报告。')}</textarea></label><p class="tiny muted">确认输入后创建协作任务，汇总到任务看板；Spec / 设计阶段保留人工确认节点。</p>`,`${btn('取消','close-modal')}${btn('确认输入，创建任务','create-spec','','primary')}`);}

function workflowImportCatalog(){return [{id:'WF-SPECX',name:'SpecX · 需求到交付',version:'1.4',description:'将 Thread 讨论整理为规格输入，经人工确认后推进开发、测试与交付。',nodes:[{type:'输入',label:'Thread → SDD 输入',hint:'目标 / 范围 / 约束 / 验收',icon:'chat'},{type:'Skill',label:'规格与设计生成',hint:'specx-spec · v1.4',icon:'spark'},{type:'人工确认',label:'Owner 确认 Spec',hint:'项目 Owner',icon:'approve'},{type:'Agent',label:'开发与测试',hint:'CodeAgent + QA Agent',icon:'agent'},{type:'输出',label:'MR、报告与验收',hint:'回到原 Thread / 任务',icon:'file'}]},{id:'WF-QUALITY',name:'质量日报生成',version:'1.2',description:'读取质量数据，归类风险，生成日报并回到工作台。',nodes:initialState().nodes.map(n=>({...n,assetId:n.type==='MCP 工具'?'ac-mcp-quality':n.type==='Skill'?'ac-skill-quality':undefined}))},{id:'WF-REVIEW',name:'每日合入与检视',version:'1.1',description:'读取仓库 MR 和 CI 状态，汇总检视缺口与需要关注的风险。',nodes:[{type:'输入',label:'仓库与分支',hint:'仓库 / main / 最近 24 小时',icon:'file'},{type:'MCP 工具',label:'读取 MR 与 CI',hint:'codehub-mcp',assetId:'ac-mcp-codehub',icon:'mcp'},{type:'Agent',label:'汇总检视与构建风险',hint:'CodeAgent',icon:'agent'},{type:'输出',label:'回到工作台',hint:'报告 / 明细 / 引用',icon:'bench'}]}];}
function snapshotCurrentWorkflow(){return {id:s.currentWorkflowId||'WF-EXISTING',label:s.wfLabel,nodes:JSON.parse(JSON.stringify(s.nodes)),scope:s.buildScope,version:s.wfVersion,saved:s.wfSaved,dirty:s.wfDirty,tested:s.wfTested,selectedNode:s.selectedNode,origin:s.wfOrigin||null};}
function rememberCurrentWorkflow(){if(!s.workflowDrafts||!s.nodes?.length)return;const record=snapshotCurrentWorkflow(),index=s.workflowDrafts.findIndex(x=>x.id===record.id);if(index<0)s.workflowDrafts.push(record);else s.workflowDrafts[index]=record;s.currentWorkflowId=record.id;}
function restoreWorkflow(record){s.currentWorkflowId=record.id;s.wfLabel=record.label;s.nodes=JSON.parse(JSON.stringify(record.nodes));s.buildScope=record.scope||s.buildScope;s.wfVersion=record.version||0;s.wfSaved=!!record.saved;s.wfDirty=!!record.dirty;s.wfTested=!!record.tested;s.selectedNode=Math.min(record.selectedNode||0,s.nodes.length-1);s.wfOrigin=record.origin||null;}
function normalizeWorkflowBuilder(){s.workflowDrafts=Array.isArray(s.workflowDrafts)?s.workflowDrafts:[];s.currentWorkflowId=s.currentWorkflowId||'WF-EXISTING';s.studioPage=s.studioPage||'editor';if(!s.workflowDrafts.length)rememberCurrentWorkflow();}
function recentWorkflowLinks(){const records=[...s.workflowDrafts].reverse().slice(0,4),labels=new Set(records.map(r=>r.label));return records.map(r=>`<button class="sidenav compact ${s.studioPage!=='import'&&s.currentWorkflowId===r.id?'current-workflow':''}" data-a="workflow-open-draft" data-v="${esc(r.id)}">${ico(r.origin?'file':'workflow')}<span>${esc(r.label)}</span></button>`).join('')+['质量日报生成','SpecX · 需求到交付'].filter(label=>!labels.has(label)).map(label=>`<button class="sidenav compact" data-a="studio" data-v="${esc(label)}">${ico('workflow')}<span>${esc(label)}</span></button>`).join('');}
function openStudio(label){rememberCurrentWorkflow();if(!['studio','extensions'].includes(s.view))s.returnView=s.view;s.view='studio';s.page='editor';s.studioPage='editor';if(label&&label!==s.wfLabel){const existing=[...s.workflowDrafts].reverse().find(r=>r.label===label);if(existing)restoreWorkflow(existing);else{const template=workflowImportCatalog().find(w=>w.name===label);restoreWorkflow({id:'WF-DRAFT-'+Date.now()+'-'+s.workflowDrafts.length,label,nodes:template?.nodes||initialState().nodes,scope:s.buildScope,version:1,saved:false,dirty:false,tested:false,selectedNode:0});}}closeModal();render();}
function openWorkflowDraft(id){const record=s.workflowDrafts.find(r=>r.id===id);if(!record)return;rememberCurrentWorkflow();restoreWorkflow(record);s.view='studio';s.page='editor';s.studioPage='editor';closeModal();render();}
function defaultWorkflowImport(){return {source:'catalog',candidate:null,name:'',scope:s.buildScope||s.project||'global',filename:'',error:'',loading:false};}

function workflowScopeOptions(value){return [['global','全局'],...projectNames.map(p=>[p,'项目 · '+p])].map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('');}
function renderWorkflowImport(){const d=s.workflowImport||defaultWorkflowImport();return `<div class="democrumb"><b>构建</b>${ico('chevron')}<span>导入已有 Workflow</span><span class="spacer"></span><span>草稿仅自己可见</span></div><div class="demopage workflow-import-page"><div class="demohead"><div><h1>从已有流程，接着构建</h1><p>复用现有编排，确认使用范围与依赖，再进入编辑器调整。</p></div>${btn('返回 Workflow 编辑器','studio','','sm')}</div><div class="workflow-import-steps"><span class="${!d.candidate?'on':'done'}">① 选择流程</span><i></i><span class="${d.candidate?'on':''}">② 预览与检查</span><i></i><span>③ 导入为草稿</span></div>${d.candidate?workflowImportPreview():`<div class="dtabs import-method-tabs">${[['catalog','选择已有流程'],['file','上传流程文件']].map(([v,l])=>`<button class="${d.source===v?'active':''}" data-a="workflow-import-source" data-v="${v}">${ico(v==='catalog'?'workflow':'file')}${l}</button>`).join('')}</div>${d.source==='catalog'?`<div class="workflow-catalog-caption"><span>当前可访问的已发布 Workflow</span>${tag('交互演示样例','gray')}</div><div class="workflow-import-catalog">${workflowImportCatalog().map(w=>`<article class="workflow-import-source-card"><div class="row between"><span class="workflow-source-icon">${ico('workflow')}</span>${tag('v'+w.version,'gray')}</div><h3>${esc(w.name)}</h3><p>${esc(w.description)}</p><div class="workflow-source-meta"><span>${w.nodes.length} 个节点</span><span>已发布流程</span></div>${btn('选择此流程 '+ico('arrow'),'workflow-import-select',w.id,'primary sm')}</article>`).join('')}</div>`:`<div class="workflow-upload-area"><span class="workflow-upload-icon">${ico('file')}</span><h2>上传已导出的 Workflow</h2><p>支持 AgentSpace Workflow JSON，最大 512 KB。<br>导入前检查节点、顺序结构与扩展依赖。</p><label class="btn primary workflow-file-picker">${ico('plus')}选择流程文件<input id="workflowImportFile" type="file" accept=".json,application/json" ${d.loading?'disabled':''}></label><small>${d.loading?'正在读取流程…':'文件内容仅用于本页交互演示'}</small>${btn('下载示例格式','workflow-import-example','','link sm')}</div>`}${d.error?`<div class="workflow-import-error" role=" function validateWorkflowDefinition(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('文件应包含一个 Workflow JSON 对象。');if(raw.format&&raw.format!=='agentspace.workflow')throw Error('当前支持 AgentSpace Workflow JSON，请先导出为兼容格式。');if(raw.schemaVersion!==undefined&&raw.schemaVersion!==1)throw Error('暂不支持此流程格式版本，请使用 schemaVersion 1。');const name=String(raw.name||'').trim();if(!name||name.length>80)throw Error('流程需包含 name，且名称不超过 80 字。');if(!Array.isArray(raw.nodes)||!raw.nodes.length||raw.nodes.length>100)throw Error('流程需包含 1 至 100 个 nodes 节点。');const allowed=['输入','触发','Agent','Skill','MCP 工具','CLI 工具','条件','人工确认','输出'];const icons={'输入':'file','触发':'clock','Agent':'agent','Skill':'spark','MCP 工具':'mcp','CLI 工具':'terminal','条件':'condition','人工确认':'approve','输出':'bench'};const nodes=raw.nodes.map((n,i)=>{if(!n||typeof n!=='object'||Array.isArray(n)||!allowed.includes(n.type))throw Error('第 '+(i+1)+' 个节点的类型暂不支持。');if(typeof n.label!=='string'||!n.label.trim())throw Error('第 '+(i+1)+' 个节点缺少 label 名称。');for(const key of ['id','hint','method','assetId','input','output'])if(n[key]!==undefined&&typeof n[key]!=='string')throw Error('第 '+(i+1)+' 个节点的 '+key+' 应为字符串。');return {...n,id:n.id||'node-'+(i+1),label:n.label.trim(),hint:n.hint||n.method||'待配置',icon:icons[n.type]};});if(new Set(nodes.map(n=>n.id)).size!==nodes.length)throw Error('节点 id 不能重复。');if(raw.edges!==undefined){if(!Array.isArray(raw.edges)||raw.edges.length!==nodes.length-1)throw Error('此原型支持顺序流程，请使用完整的顺序连线。复杂分支需在原编辑器中处理。');const expected=new Set(nodes.slice(1).map((n,i)=>nodes[i].id+'\u0000'+n.id));for(const edge of raw.edges){const key=edge?.from+'\u0000'+edge?.to;if(!expected.delete(key))throw Error('此原型支持顺序流程，当前连线包含分支、重复或无效节点。');}if(expected.size)throw Error('流程连线不完整。');}return {name,version:String(raw.version||'未标注'),description:String(raw.description||'').slice(0,800),nodes,edges:raw.edges||null};}
function chooseWorkflowImport(id){const source=workflowImportCatalog().find(w=>w.id===id);if(!source)return;const d=s.workflowImport;d.candidate={...validateWorkflowDefinition(source),sourceId:source.id,sourceLabel:'已发布流程'};d.name=source.name+' · 导入副本';d.error='';d.filename='';render();}
function importedDependencyChecks(nodes,scope){return nodes.filter(n=>nodeExtensionType(n)).map(n=>{const type=nodeExtensionType(n),choices=availableExtensions(type,scope);const match=n.assetId?choices.find(a=>a.id===n.assetId):choices.find(a=>(n.method||n.hint||'').includes(a.name));return {node:n,type,asset:match||null,ready:!!match};});}

c(c.node.assetId||c.node.hint)}</small></span>${tag(c.ready?'已安装':'待补齐',c.ready?'green':'gold')}</div>`).join(''):'<p class="small muted">此流程未引用 MCP、CLI 或 Skill 扩展。</p>'}</div></section></div>`;}
let workflowFileReadToken=0;
async function readWorkflowImportFile(file){if(!file)return;const token=++workflowFileReadToken,d=s.workflowImport;d.candidate=null;d.error='';d.loading=true;render();try{if(file.size>512*1024)throw Error('文件超过 512 KB，请选择较小的 Workflow JSON。');const raw=JSON.parse(await file.text());if(token!==workflowFileReadToken)return;const candidate=validateWorkflowDefinition(raw);d.candidate={...candidate,sourceLabel:'流程文件'};d.name=candidate.name+' · 导入副本';d.filename=file.name;}catch(error){if(token===workflowFileReadToken)d.error=error instanceof SyntaxError?'文件不是有效 JSON，请检查后重新选择。':error.message;}finally{if(token===workflowFileReadToken){d.loading=false;render();}}}
function commitWorkflowImport(){const d=s.workflowImport;if(!d?.candidate||d.loading)return;d.name=d.name.trim();if(!d.name||d.name.length>100){notify('请填写 1 至 100 字的新草稿名称。');return;}if(d.scope!=='global'&&!projectNames.includes(d.scope)){notify('请选择有效的使用范围。');return;}rememberCurrentWorkflow();const record={id:'WF-IMPORTED-'+Date.now()+'-'+s.workflowDrafts.length,label:d.name,nodes:JSON.parse(JSON.stringify(d.candidate.nodes)),scope:d.scope,version:0,saved:true,dirty:false,tested:false,selectedNode:0,origin:{kind:d.source,name:d.candidate.name,sourceId:d.candidate.sourceId||null,version:d.candidate.version,filename:d.filename||null}};s.workflowDrafts.push(record);restoreWorkflow(record);s.studioPage='editor';s.view='studio';s.page='editor';s.workflowImport=null;closeModal();render();notify('已导入为独立草稿，检查节点配置后即可调试。');}
function downloadWorkflowExample(){const w=workflowImportCatalog().find(w=>w.id==='WF-QUALITY'),nodes=w.nodes.map((n,i)=>({...n,id:'node-'+(i+1)}));const payload={format:'agentspace.workflow',schemaVersion:1,name:w.name,version:w.version,description:w.description,nodes,edges:nodes.slice(1).map((n,i)=>({from:nodes[i].id,to:n.id}))};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='AgentSpace_Workflow_example.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function normalizeMessenger(){s.messengerSection=['conversations','contacts'].includes(s.messengerSection)?s.messengerSection:'conversations';s.messengerSelectedContact=s.messengerSelectedContact||null;s.messageDrafts=s.messageDrafts||{};s.messageReplies=s.messageReplies||{};s.messageScrolls=s.messageScrolls||{};s.messageUnreadBoundary=s.messageUnreadBoundary||{};s.messengerReadIds=s.messengerReadIds||[];s.messengerType=s.messengerType||'all';s.messengerMobilePane=s.messengerMobilePane||'list';s.messengerDetails=!!s.messengerDetails;s.messengerFind=s.messengerFind||{open:false,query:'',index:0};s.messengerDirectoryQuery=s.messengerDirectoryQuery||'';if(s.messageTab==='contacts')s.messageTab='conversations';normalizeChannelHub();}

function msHighlight(text,query){const source=String(text||''),q=String(query||'').trim();if(!q)return esc(source);const lower=source.toLowerCase(),needle=q.toLowerCase();let out='',start=0,index;while((index=lower.indexOf(needle,start))>=0){out+=esc(source.slice(start,index))+'<mark>'+esc(source.slice(index,index+q.length))+'</mark>';start=index+q.length;}return out+esc(source.slice(start));}
function messageConversations(){const q=(s.messageQuery||'').trim().toLowerCase();return s.conversations.filter(c=>(s.messageScope==='all'||c.relatedProjects.includes(s.messageScope))&&(s.messengerType==='all'||c.type===s.messengerType)&&(s.messageFilter==='all'||s.messageFilter==='unread'&&(c.unread>0||s.messengerReadIds.includes(c.id))||s.messageFilter==='following'&&c.followed||s.messageFilter==='mentions'&&c.mentioned||s.messageFilter==='later'&&c.later)&&(!q||[c.title,...c.relatedProjects,...c.members.map(msSender),...c.messages.map(m=>m.text)].join(' ').toLowerCase().includes(q))).sort((a,b)=>Number(b.followed)-Number(a.followed)||(b.activitySort||0)-(a.activitySort||0));}

function conversationResults(){const rows=messageConversations();return rows.length?rows.map(c=>{const latest=c.messages.at(-1),channel=c.type==='channel';return `<button class="ms-conversation ${channel?'hub-channel-conversation':''} ${s.activeConversation===c.id?'selected':''} ${c.unread?'unread':''}" data-a="message-open" data-v="${esc(c.id)}" aria-pressed="${s.activeConversation===c.id}">${msConversationAvatar(c)}<span class="ms-conversation-copy"><span class="ms-conversation-title"><b>${msHighlight(c.title,s.messageQuery)}</b>${c.followed?`<i class="ms-star">${ico('star')}</i>`:''}${c.later?'<i class="ms-later">'+ico('clock')+'</i>':''}<time>${esc(latest?.time||'刚刚')}</time></span>${channel?`<small class="hub-channel-source">${msHighlight(c.project,s.messageQuery)}<i>项目频道</i></small>`:''}<span class="ms-conversation-preview">${msConversationPreview(c)}</span></span>${c.unread?`<i class="ms-unread">${c.unread>99?'99+':c.unread}</i>`:''}</button>`;}).join(''):`<div class="ms-list-empty">${ico('chat')}<b>暂无匹配的会话</b><p>可以调整筛选，或从通讯录开始新对话。</p>${btn('清除筛选','ms-reset','','sm')}</div>`;}
function msListCriteria(){return [s.messengerType==='dm'?'私信':s.messengerType==='group'?'群聊':s.messengerType==='channel'?'项目频道':'',s.messageScope==='all'?'':s.messageScope].filter(Boolean);}
function renderConversationWorkspace(){const unread=s.conversations.reduce((n,c)=>n+c.unread,0),criteria=msListCriteria();return `<div class="messenger-shell" data-section="conversations" data-mobile-pane="${s.messengerMobilePane}"><aside class="ms-list-pane">${messengerSectionHeader(unread)}<div class="ms-list-search">${ico('search')}<input id="messengerQuery" aria-label="搜索会话和消息" placeholder="搜索联系人、频道与消息" value="${esc(s.messageQuery||'')}"><button id="messengerClearQuery" data-a="ms-clear-query" aria-label="清除搜索" ${s.messageQuery?'':'hidden'}>${ico('close')}</button></div><nav class="ms-filter-tabs" aria-label="消息筛选">${[['all','全部'],['unread','未读'],['following','关注'],['mentions','@我'],['later','稍后']].map(([v,l])=>`<button class="${s.messageFilter===v?'active':''}" data-a="message-filter" data-v="${v}">${l}</button>`).join('')}</nav><div class="ms-list-caption"><span id="messengerListCount">${criteria.length?esc(criteria.join(' · ')):'最近会话'} <i>· ${messageConversations().length}</i></span>${criteria.length?`<button class="ms-caption-reset" data-a="ms-reset" title="清除筛选" aria-label="清除筛选">${ico('close')}</button>`:''}<button class="${criteria.length?'filtered':''}" data-a="ms-filter">${ico('filter')}筛选</button></div><div class="ms-conversations" id="conversationResults">${conversationResults()}</div><footer class="ms-list-foot"><span>${ico('shield')}按会话与项目权限展示</span><button data-a="ms-read-all">全部已读</button></footer></aside><section class="ms-stage"><main class="ms-chat" id="messageConversation">${renderConversation()}</main>${s.messengerDetails&&conversation()?renderMessengerDetails():''}</section></div>`;}
function msConversationSubtitle(c){if(c.type==='channel')return c.project+' · 项目频道 · 项目成员可见';if(c.type==='group')return c.members.length+' 位成员 · '+(c.relatedProjects.length?c.relatedProjects.join(' / '):'跨项目群聊');const p=person(c.members.find(id=>id!=='me'));return (p?.status||'私信')+' · '+(p?.type==='agent'?p.role:p?.team||'仅会话成员可见');}
function renderConversation(){const c=conversation();if(!c)return `<div class="ms-chat-empty">${ico('chat')}<h2>选择一段对话，继续协作</h2><p>私信、群聊和 Agent 消息，都在这里接续。</p>${btn('新建消息','ms-new','','primary')}</div>`;const q=s.messengerFind.query,reply=c.messages.find(m=>m.id===s.messageReplies[c.id]);return `<header class="ms-chat-head"><button class="ms-mobile-back" data-a="ms-back" aria-label="返回会话列表">${ico('back')}</button>${msConversationAvatar(c)}<div class="ms-chat-title"><h2>${esc(c.title)}${c.followed?`<i class="ms-star">${ico('star')}</i>`:''}${c.later?'<span class="ms-title-later">稍后</span>':''}</h2><p>${esc(msConversationSubtitle(c))}</p></div>${c.type==='channel'?btn(ico('home')+'<span class="hub-channel-link-label">进入频道</span>','hub-open-channel',JSON.stringify([c.project,c.channelId]),'sm hub-channel-link'):''}<div class="ms-chat-actions"><button class="${s.messengerFind.open?'active':''}" data-a="ms-find-toggle" aria-label="搜索当前会话" title="搜索当前会话">${ico('search')}</button><button class="${s.messengerDetails?'active':''}" data-a="ms-details" aria-label="会话详情" title="会话详情">${ico('info')}</button><button data-a="ms-menu" aria-label="更多会话操作" title="更多操作">${ico('more')}</button></div></header>${s.messengerFind.open?`<div class="ms-find-bar">${ico('search')}<input id="messengerFindQuery" aria-label="搜索当前会话内容" placeholder="搜索当前会话内容" value="${esc(q)}"><span id="messengerFindCount">${msFindCountLabel(c)}</span><button data-a="ms-find-prev" title="上一条匹配">${ico('up')}</button><button data-a="ms-find-next" title="下一条匹配">${ico('down')}</button><button data-a="ms-find-toggle" title="关闭会话内搜索">${ico('close')}</button></div>`:''}<div class="ms-history" id="messengerHistory" data-conversation="${c.id}">${messengerHistory(c)}</div><div class="ms-compose-wrap">${c.type==='channel'?`<p class="hub-channel-note">发送到 ${esc(c.project)} / ${esc(c.title)} · 项目成员可见</p>`:''}${reply?`<div class="ms-reply-draft"><span>${ico('reply')}回复 <b>${esc(msSender(reply.by))}</b><i>${esc(reply.text)}</i></span><button data-a="ms-reply-clear" aria-label="取消引用">${ico('close')}</button></div>`:''}<div class="ms-composer"><textarea id="privateMessageInput" rows="2" aria-label="发送到当前会话" placeholder="${c.type==='channel'?'发送到 ':'发送给 '}${esc(c.title)}…">${esc(s.messageDrafts[c.id]||'')}</textarea><div class="ms-compose-toolbar"><span><kbd>Enter</kbd> 发送 <i>·</i> <kbd>Shift + Enter</kbd> 换行</span>${btn(ico('send')+'发送','message-send','','primary')}</div></div></div>`;}
function messengerHistory(c){if(c.type==='channel')return hubRenderChannelHistory(c);if(!c.messages.length)return `<div class="ms-history-empty">${ico('chat')}<h3>对话已就绪</h3><p>发送第一条消息，和 ${esc(c.title)} 开始协作。</p></div>`;const q=s.messengerFind.query;let previousDay=null;return c.messages.map((m,index)=>{const previous=c.messages[index-1],day=m.day||(m.time==='昨天'?'昨天':'今天'),compact=previous&&previous.by===m.by&&(previous.day||(previous.time==='昨天'?'昨天':'今天'))===day,hit=q&&m.text.toLowerCase().includes(q.toLowerCase());let divider='';if(day!==previousDay){previousDay=day;divider=`<div class="ms-day"><span>${esc(day)}</span></div>`;}if(index===s.messageUnreadBoundary[c.id])divider+='<div class="ms-new-divider"><span>以下为新消息</span></div>';return divider+`<article id="ms-message-${esc(m.id)}" class="ms-message ${compact?'compact':''} ${m.by==='me'?'mine':''} ${hit?'ms-hit':''}" data-message-id="${esc(m.id)}"><div class="ms-message-avatar">${compact?`<span class="ms-compact-time">${esc(m.time)}</span>`:msPersonAvatar(m.by)}</div><div class="ms-message-content">${compact?'':`<div class="ms-message-meta"><b>${esc(msSender(m.by))}</b>${person(m.by)?.type==='agent'?'<span class="ms-ai-badge">Agent</span>':''}<time>${esc(m.time)}</time></div>`}${m.replyTo?`<button class="ms-message-quote" data-a="ms-jump" data-v="${esc(m.replyTo.id)}"><b>${esc(msSender(m.replyTo.by))}</b><span>${esc(m.replyTo.text)}</span></button>`:''}<p>${msHighlight(m.text,q)}</p></div><div class="ms-message-actions"><button data-a="ms-reply" data-v="${esc(c.id+'|'+m.id)}" title="引用回复" aria-label="引用回复">${ico('reply')}</button><button data-a="message-share" data-v="${esc(c.id+'|'+m.id)}" title="发起项目话题" aria-label="发起项目话题">${ico('arrow')}</button><button data-a="message-copy" title="复制" aria-label="复制">${ico('copy')}</button><button data-a="ms-message-menu" data-v="${esc(c.id+'|'+m.id)}" title="更多消息操作" aria-label="更多消息操作">${ico('more')}</button></div></article>`;}).join('');}
function renderMessengerDetails(){const c=conversation();return `<aside class="ms-details"><header><h3>${c.type==='channel'?'频道详情':'会话详情'}</h3><button data-a="ms-details" aria-label="关闭会话详情">${ico('close')}</button></header><div class="ms-detail-identity">${msConversationAvatar(c)}<h3>${esc(c.title)}</h3><p>${c.type==='channel'?'项目频道':c.type==='group'?'群聊':'私信'} · ${c.members.length} 位成员</p></div><div class="ms-detail-flags"><button class="${c.followed?'active':''}" data-a="message-follow">${ico('star')}${c.followed?'已特别关注':'特别关注'}</button><button class="${c.later?'active':''}" data-a="message-later">${ico('clock')}${c.later?'已加入稍后':'稍后处理'}</button></div>${c.type==='channel'?`<section><h4>来源频道</h4><button class="ms-detail-project" data-a="hub-open-channel" data-v="${esc(JSON.stringify([c.project,c.channelId]))}">${ico('chat')}<span>${esc(c.project)} / ${esc(c.title)}</span>${ico('arrow')}</button><p class="tiny muted">${esc(c.description||'项目协作讨论')}</p></section>`:''}<section><h4>会话成员 <span>${c.members.length}</span></h4>${c.members.map(id=>{const p=person(id);return `<div class="ms-detail-member">${msPersonAvatar(id)}<div><b>${esc(msSender(id))}</b><small>${id==='me'?'当前账号':esc(p?.role||'成员')}</small></div></div>`;}).join('')}</section><section><h4>关联项目</h4>${c.relatedProjects.map(project=>`<button class="ms-detail-project" data-a="ms-open-project" data-v="${esc(project)}">${ico('team')}<span>${esc(project)}</span>${ico('chevron')}</button>`).join('')||'<p class="ms-detail-empty">这段会话尚未关联项目。</p>'}</section><div class="ms-detail-note">${ico('shield')}${c.type==='channel'?'此处与项目频道同步，消息和 Thread 对项目成员可见。':'消息仅对会话成员可见。转为项目话题时，可单独确认分享内容与目标项目。'}</div></aside>`;}
function msFindHits(c=conversation()){const q=s.messengerFind.query.trim().toLowerCase();return c&&q?c.messages.filter(m=>m.text.toLowerCase().includes(q)):[];}
function msFindCountLabel(c){const hits=msFindHits(c);return s.messengerFind.query?(hits.length?(s.messengerFind.index+1)+' / '+hits.length:'无匹配'):'';}
function jumpMessengerHit(delta=0){const hits=msFindHits();if(!hits.length)return;s.messengerFind.index=(s.messengerFind.index+delta+hits.length)%hits.length;const el=document.getElementById('ms-message-'+hits[s.messengerFind.index].id);el?.scrollIntoView({block:'center',behavior:'smooth'});$$('.ms-hit-current').forEach(e=>e.classList.remove('ms-hit-current'));el?.classList.add('ms-hit-current');if($('#messengerFindCount'))$('#messengerFindCount').textContent=msFindCountLabel(conversation());}
function updateMessengerSearch(query){s.messengerFind.query=query;s.messengerFind.index=0;$('#messengerHistory').innerHTML=messengerHistory(conversation());$('#messengerFindCount').textContent=msFindCountLabel(conversation());jumpMessengerHit();save();}
function captureMessengerViewport(){const history=$('.ms-history');if(history&&history.clientHeight>0&&s?.messageScrolls)s.messageScrolls[history.dataset.conversation]={top:history.scrollTop,bottom:history.scrollHeight-history.scrollTop-history.clientHeight<50};}
function resizeMessengerComposer(){const input=$('#privateMessageInput');if(!input)return;input.style.height='auto';input.style.height=Math.min(136,Math.max(54,input.scrollHeight))+'px';}
function afterMessengerRender(){if(s.view!=='messages')return;const history=$('.ms-history'),c=conversation();if(history&&history.clientHeight>0&&c){const scroll=s.messageScrolls[c.id];if(messengerForceBottom||!scroll||scroll.bottom)history.scrollTop=history.scrollHeight;else history.scrollTop=scroll.top;if(s.messengerFind.open&&s.messengerFind.query)jumpMessengerHit();}resizeMessengerComposer();if(messengerFocusComposer)requestAnimationFrame(()=>$('#privateMessageInput')?.focus());messengerForceBottom=false;messengerFocusComposer=false;}
function sendMessengerMessage(){const c=conversation(),text=$('#privateMessageInput')?.value.trim();if(!c||!text){notify('先输入消息内容。');return;}if(c.type==='channel'){hubSendInbox(c,text);return;}const reply=c.messages.find(m=>m.id===s.messageReplies[c.id]);const m={id:'msg-'+Date.now()+'-'+c.messages.length,by:'me',text,time:new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}),day:'今天'};if(reply)m.replyTo={id:reply.id,by:reply.by,text:reply.text.slice(0,300)};c.messages.push(m);c.activitySort=Date.now();c.unread=0;s.messageDrafts[c.id]='';delete s.messageReplies[c.id];delete s.messageUnreadBoundary[c.id];messengerForceBottom=true;messengerFocusComposer=true;render();}
function quoteMessengerMessage(ref){const [cid,mid]=ref.split('|');if(cid!==s.activeConversation)return;s.messageReplies[cid]=mid;messengerFocusComposer=true;closeModal();render();}
function toggleMessengerFlag(flag){const c=conversation();if(!c)return;c[flag]=!c[flag];if((s.messageFilter==='following'&&!c.followed)||(s.messageFilter==='later'&&!c.later))syncMessengerSelection();render();}
function openMessengerMenu(){const c=conversation();if(!c)return;modal('会话操作',`<div class="ms-menu-list"><button data-a="ms-menu-follow">${ico('star')}<span>${c.followed?'取消特别关注':'设为特别关注'}</span></button><button data-a="ms-menu-later">${ico('clock')}<span>${c.later?'移出稍后处理':'加入稍后处理'}</span></button><button data-a="ms-mark-unread">${ico('chat')}<span>标为未读</span></button><button data-a="ms-menu-details">${ico('info')}<span>查看会话详情</span></button></div>`);}
function openMessengerMessageMenu(ref){modal('消息操作',`<div class="ms-menu-list"><button data-a="ms-reply" data-v="${esc(ref)}">${ico('reply')}<span>引用回复</span></button><button data-a="message-share" data-v="${esc(ref)}">${ico('arrow')}<span>发起项目话题</span></button></div>`);}
function openMessengerFilters(){modal('筛选会话',`<label class="field">会话类型<select id="messengerTypeFilter">${[['all','全部会话'],['dm','私信'],['group','群聊'],['channel','项目频道']].map(([v,l])=>`<option value="${v}" ${s.messengerType===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">关联项目<select id="messengerProjectFilter"><option value="all">全部项目</option>${projectNames.map(p=>`<option ${s.messageScope===p?'selected':''}>${esc(p)}</option>`).join('')}</select></label>`,`${btn('清除筛选','ms-reset')}${btn('应用筛选','ms-filter-apply','','primary')}`);}
function messengerDirectoryResults(){const q=(s.messengerDirectoryQuery||'').trim().toLowerCase();const rows=DIRECTORY.filter(p=>(s.directoryFilter==='all'||s.directoryFilter==='people'&&p.type==='person'||s.directoryFilter==='agents'&&p.type==='agent'||p.projects.includes(s.directoryFilter))&&(!q||(p.name+p.role+p.team).toLowerCase().includes(q)));return rows.map(p=>`<button class="ms-directory-row" data-a="directory-message" data-v="${p.id}">${msPersonAvatar(p.id)}<span><b>${esc(p.name)}${p.type==='agent'?'<i>Agent</i>':''}</b><small>${esc(p.role)} · ${esc(p.team)}</small></span><em>发消息 ${ico('arrow')}</em></button>`).join('')||'<div class="empty">没有匹配的联系人。</div>';}
function openMessengerNew(){modal('新建消息',`<div class="ms-new-choices"><button data-a="ms-directory">${ico('personal')}<b>发起私信</b><p>找到同事或 Agent，开始一段对话。</p>${ico('arrow')}</button><button data-a="ms-new-group">${ico('team')}<b>新建群聊</b><p>邀请多人和 Agent，一起讨论与推进。</p>${ico('arrow')}</button></div>`);}
function startDirectMessage(id){const p=person(id);if(!p)return;let c=s.conversations.find(c=>c.type==='dm'&&c.members.includes(id));if(!c){c={id:'dm-'+Date.now(),type:'dm',title:p.name,members:['me',id],relatedProjects:[...p.projects],unread:0,followed:false,mentioned:false,later:false,activitySort:Date.now(),messages:[]};s.conversations.push(c);}s.view='messages';s.page='messages';s.messengerSection='conversations';s.messageTab='conversations';s.messageFilter='all';s.messageQuery='';s.messageScope='all';s.messengerType='all';s.messengerReadIds=[];closeModal();openMessengerConversation(c.id);messengerFocusComposer=true;afterMessengerRender();}
function shareMessage(ref){const [cid,mid]=ref.split('|'),c=conversation(cid),m=c?.messages.find(x=>x.id===mid);if(!m)return;if(c.type==='channel'){hubOpenChannelMessage(c.id,m.id);return;}const project=c.relatedProjects[0]||s.project;modal('将选中消息发起为项目话题',`<div class="ms-share-preview"><small>${esc(c.title)} · ${esc(msSender(m.by))} · ${esc(m.time)}</small><p>${esc(m.text)}</p></div><label class="field">话题标题<input id="shareMessageTitle" value="${esc(m.text.slice(0,35))}"></label><div class="form-grid2"><label class="field">目标项目<select id="shareMessageProject">${projectNames.map(p=>`<option ${p===project?'selected':''}>${esc(p)}</option>`).join('')}</select></label><label class="field">目标频道<select id="shareMessageChannel">${projectChannels(project).map(c=>`<option value="${esc(c.id)}" ${c.id==='development'?'selected':''}># ${esc(c.name)}</option>`).join('')}</select></label></div><label class="field">分享内容<textarea id="shareMessageText" rows="4">${esc(m.text)}</textarea></label><div class="note" style="font-size:11px">创建后，上方选中的分享内容将对目标项目成员可见。</div>`,`${btn('取消','close-modal')}${btn('创建项目 Thread','message-share-confirm',ref,'primary')}`);}

function messengerSectionHeader(unread){return `<header class="ms-list-head"><h1>消息${unread?`<span title="${unread} 条未读消息">${unread}</span>`:''}</h1><div class="ms-list-head-actions"><button class="ms-compose-new" data-a="ms-new" title="新建消息" aria-label="新建消息">${ico('plus')}</button></div></header><nav class="ms-primary-tabs" aria-label="消息视图"><button class="${s.messengerSection==='conversations'?'active':''}" data-a="ms-section" data-v="conversations" aria-current="${s.messengerSection==='conversations'?'page':'false'}">${ico('chat')}会话</button><button class="${s.messengerSection==='contacts'?'active':''}" data-a="ms-section" data-v="contacts" aria-current="${s.messengerSection==='contacts'?'page':'false'}">${ico('book')}通讯录</button></nav>`;}
function messengerContacts(){const q=(s.messengerDirectoryQuery||'').trim().toLowerCase();return DIRECTORY.filter(p=>(s.directoryFilter==='all'||s.directoryFilter==='people'&&p.type==='person'||s.directoryFilter==='agents'&&p.type==='agent'||p.projects.includes(s.directoryFilter))&&(!q||(p.name+p.role+p.team).toLowerCase().includes(q)));}
function syncMessengerContact(){const rows=messengerContacts();if(!rows.some(p=>p.id===s.messengerSelectedContact))s.messengerSelectedContact=rows[0]?.id||null;}
function switchMessengerSection(section){if(!['conversations','contacts'].includes(section))return;s.view='messages';s.page='messages';s.messengerSection=section;s.messengerMobilePane='list';s.messengerDetails=false;if(section==='contacts')syncMessengerContact();else syncMessengerSelection();closeModal();render();}

function hubChannelMessages(project,channel){
 const rows=[];
 const root=(key,kind)=>{const info=coThreadInfo(key,kind,project);rows.push({id:'channel-root-'+encodeURIComponent(project)+'-'+key,by:hubSenderId(info.name),text:info.text,time:info.time,day:'今天',threadKey:key,threadKind:info.kind,threadTitle:info.title});};
 if(channel==='development')root('perf','temp');
 if(channel==='requirement')root('spec','fixed');
 if(project==='AICS'&&channel==='development'&&s.customThreads?.['aics-scheduler'])root('aics-scheduler','temp');
 s.channelMessages.forEach((m,index)=>{if(m.project!==project||m.channel!==channel)return;if(!m.id)m.id=hubMessageId();const th=m.threadKey?coThreadInfo(m.threadKey,s.customThreads?.[m.threadKey]?.mode||'temp',project):null;
  rows.push({id:m.id,by:m.by||hubSenderId(th?.name||m.name||'我'),text:th?.text||m.text,time:th?.time||m.time||'刚刚',day:m.day||'今天',replyTo:m.replyTo,sourceIndex:index,threadKey:m.threadKey,threadKind:th?.kind,threadTitle:th?.title});
 });
 const clock=m=>{const x=/^(\d{1,2}):(\d{2})$/.exec(m.time||'');return x?Number(x[1])*60+Number(x[2]):2000;};
 return rows.map((m,i)=>({...m,_i:i})).sort((a,b)=>clock(a)-clock(b)||a._i-b._i).map(({_i,...m})=>m);

function normalizeConversationExamples(){
 const joined=new Set(joinedProjects());
 s.conversationExampleSeeded=s.conversationExampleSeeded||{};s.customThreads=s.customThreads||{};
 for(const group of [...conversationExampleSeeds(),...agentSpaceProductExamples()]){
  const marker='v21::'+group.project+'::'+group.channel;
  if(!joined.has(group.project)||s.conversationExampleSeeded[marker])continue;
  const channel=projectChannels(group.project).find(c=>c.id===group.channel);if(!channel)continue;
  for(const [id,by,time,text] of group.messages){
   const mid=(group.productExample?'channel-product-v23-':'channel-example-v21-')+id;
   if(!s.channelMessages.some(m=>m.id===mid))s.channelMessages.push({id:mid,project:group.project,channel:group.channel,by,name:msSender(by),time,day:'今天',text});
  }
  for(const seed of group.threads){
   if(!s.customThreads[seed.key])s.customThreads[seed.key]={project:group.project,channel:group.channel,title:seed.title,text:seed.text,mode:seed.mode,createdBy:seed.createdBy,time:seed.time,demoReplies:seed.replies.map(r=>({...r}))};
   const mid=(group.productExample?'channel-product-v23-root-':'channel-example-v21-root-')+seed.key;
   if(!s.channelMessages.some(m=>m.id===mid||m.project===group.project&&m.threadKey===seed.key))s.channelMessages.push({id:mid,project:group.project,channel:group.channel,by:hubSenderId(seed.createdBy),name:seed.createdBy,time:seed.time,day:'今天',text:seed.text,threadKey:seed.key});
  }
  channel.activeInMessages=true;s.conversationExampleSeeded[marker]=true;
 }
}

function normalizeChannelHub(){
 if(!s?.conversations||!s.channelMessages)return;
 const joined=new Set(joinedProjects());s.hubSeededChannels=s.hubSeededChannels||{};
 normalizeConversationExamples();
 hubChannelSeeds().forEach((seed,i)=>{const key=seed.project+'::'+seed.channel;if(!joined.has(seed.project)||s.hubSeededChannels[key])return;
  const channel=projectChannels(seed.project).find(c=>c.id===seed.channel);if(!channel)return;
  seed.rows.forEach(([id,by,time,text])=>{const mid='channel-demo-'+id;if(!s.channelMessages.some(m=>m.id===mid))s.channelMessages.push({id:mid,project:seed.project,channel:seed.channel,by,name:msSender(by),time,day:'今天',text});});
  channel.activeInMessages=true;channel.hubInitialUnread=seed.unread;channel.hubInitialFollowed=!!seed.followed;channel.hubInitialSort=Date.now()-(i+1)*60000;s.hubSeededChannels[key]=true;
 });
 // Only participating projects are surfaced in the personal inbox.
 s.conversations=s.conversations.filter(c=>c.type!=='channel'||joined.has(c.project)&&projectChannels(c.project).some(ch=>ch.id===c.channelId));
 for(const project of joined){for(const channel of projectChannels(project)){
  const id=hubChannelId(project,channel.id),existing=s.conversations.find(c=>c.id===id);
  const active=channel.activeInMessages||existing||s.channelMessages.some(m=>m.project===project&&m.channel===channel.id)||(s.view==='team'&&s.page==='channel'&&s.project===project&&s.channel===channel.id);
  if(!active)continue;channel.activeInMessages=true;
  const c=existing||{id,type:'channel',unread:channel.hubInitialUnread||0,followed:!!channel.hubInitialFollowed,mentioned:false,later:false,activitySort:channel.hubInitialSort||Date.now()};
  Object.assign(c,{type:'channel',project,channelId:channel.id,title:'# '+channel.name,members:hubMemberIds(),relatedProjects:[project],description:channel.description,messages:hubChannelMessages(project,channel.id)});
  if(!existing){c.mentioned=c.messages.slice(-Math.max(1,c.unread)).some(m=>m.text.includes('@我'));s.conversations.push(c);}
  if(s.view==='team'&&s.page==='channel'&&s.project===project&&s.channel===channel.id&&!(s.threadOpen&&(s.threadExpanded||innerWidth<=760))&&!(coMembersVisible()&&innerWidth<=760))markMessengerRead(c);
 }}
}
function hubAppendChannel(project,channel,text,{replyTo=null}={}){
 if(!joinedProjects().includes(project)||!projectChannels(project).some(c=>c.id===channel))return null;
 const m={id:hubMessageId(),project,channel,text,by:'me',name:'我',time:new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}),day:'今天'};
 if(replyTo)m.replyTo={id:replyTo.id,by:replyTo.by,text:replyTo.text.slice(0,300)};
 if(/@(?:CodeAgent|QA Agent|OfficeACE)/i.test(text)){const key='topic-'+Date.now()+'-'+s.channelMessageSeq;s.customThreads=s.customThreads||{};s.customThreads[key]={project,channel,title:text.slice(0,36),text,mode:'temp',createdBy:'我',time:m.time};m.threadKey=key;}
 s.channelMessages.push(m);const ch=projectChannels(project).find(c=>c.id===channel);ch.activeInMessages=true;
 normalizeChannelHub();const c=conversation(hubChannelId(project,channel));if(c){c.activitySort=Date.now();c.unread=0;}
 return m;
}
