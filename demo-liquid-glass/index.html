function evolutionMemoryState(r){return r.state==='pending'?tag('待确认','gold'):r.state==='paused'?tag('已停用','gray'):'<span class="evo-confirmed">已确认</span>';}
function evolutionAssetCard(r){return `<article class="evo-memory-card" data-experience-id="${esc(r.id)}"><div class="row">${tag(esc(r.kind),'gray')}${s.evolutionCenter.scope==='all'?tag(esc(r.scope),'gray'):''}${evolutionMemoryState(r)}<span class="spacer"></span><small>${r.version?'v'+r.version:'尚未生效'}</small></div><h3>${esc(r.title)}</h3><p>${esc(r.summary)}</p><footer><span>${esc(r.owner)} · ${esc(r.updated)}</span><span class="spacer"></span>${btn(r.state==='pending'?'确认这条记忆':'查看详情'+ico('arrow'),'evolution-asset',r.id,'link sm')}</footer></article>`;}
function evolutionOverview(){const e=s.evolutionCenter,proposals=evolutionRows('proposals',false),assets=evolutionRows('assets',false).filter(r=>r.state==='confirmed'),active=proposals.filter(p=>['pending','ready','blocked'].includes(p.status)),personal=e.scope==='个人';return `<section class="evo-hero"><div><div class="evo-eyebrow">理解 · 评估 · 改进</div><h2>${personal?'工作习惯，正在成为可确认的偏好':'协作经验，正在成为可复用的方法'}</h2><p>${assets.length} 条${personal?'记忆':'规则'}已确认 · ${active.length} 项改进候选 · 持续记录任务反馈</p></div><span class="evo-hero-face">${personal?'梁':ico('team')}</span></section><div class="evo-stages">${EVO_STAGES.map((stage,i)=>{const count=active.filter(p=>p.stage===stage.id).length;return `<button class="evo-stage" data-a="evolution-stage" data-v="${stage.id}"><span class="evo-stage-top"><span>阶段 0${i+1}</span>${ico(stage.icon)}</span><strong>${stage.name}</strong><p>${stage.desc}</p><span class="evo-stage-foot"><span>${count} 项候选</span>${ico('arrow')}</span></button>`;}).join('')}</div><div class="evo-dashboard"><section class="evo-panel"><header class="evo-panel-head"><h2>下一步改进</h2><button class="evo-text-btn" data-a="evolution-tab" data-v="improve">查看全部${ico('arrow')}</button></header>${active.slice(0,3).map(evolutionProposalCard).join('')||evolutionEmpty('当前范围没有待推进的改进。')}</section><aside class="evo-panel"><header class="evo-panel-head"><h2>已了解的内容</h2></header><div class="evo-understood">${assets.slice(-3).reverse().map(r=>`<article class="evo-memory-summary"><button data-a="evolution-asset" data-v="${r.id}">${esc(r.title)}</button><small>${esc(r.owner)}明确反馈 · ${esc(r.source.label)}</small><span class="evo-confirmed">已确认</span></article>`).join('')||evolutionEmpty('确认后的记忆与规则会出现在这里。')}</div><footer class="evo-panel-foot">${ico('shield')}${personal?'个人私有 · 由你确认与管理':'按项目授权范围生效'}<span class="spacer"></span><button class="evo-text-btn" data-a="evolution-tab" data-v="memory">管理${ico('arrow')}</button></footer></aside></div>`;}
function evolutionMetrics(items){return `<div class="evo-compact-metrics">${items.map(([label,value,unit])=>`<div><span>${label}</span><strong>${value}<small>${unit}</small></strong></div>`).join('')}</div>`;}
function evolutionFilters(type){const e=s.evolutionCenter;return `<div class="evo-filters">${type==='proposals'?`<select id="evolutionStage" aria-label="进化类型"><option value="all">全部进化类型</option>${EVO_STAGES.map(x=>`<option value="${x.id}" ${e.stage===x.id?'selected':''}>${x.name}</option>`).join('')}</select><select id="evolutionStatus" aria-label="改进状态">${Object.entries({all:'全部改进状态',pending:'待评估',ready:'待采纳',blocked:'待改进',adopted:'已采纳',dismissed:'未采纳'}).map(([id,label])=>`<option value="${id}" ${e.status===id?'selected':''}>${label}</option>`).join('')}</select>`:type==='assets'?`<select id="evolutionMemoryState" aria-label="记忆与规则状态">${Object.entries({all:'全部状态',confirmed:'已确认',pending:'待确认',paused:'已停用'}).map(([id,label])=>`<option value="${id}" ${e.memoryState===id?'selected':''}>${label}</option>`).join('')}</select>`:`<select id="evolutionTraceStatus" aria-label="执行状态">${['全部执行状态','已完成','反馈待处理','需关注'].map((label,i)=>`<option value="${i?label:'all'}" ${e.traceStatus===(i?label:'all')?'selected':''}>${label}</option>`).join('')}</select>`}<button class="evo-text-btn" data-a="evolution-reset">重置筛选</button><label class="evo-searchbox">${ico('search')}<input id="evolutionQuery" aria-label="搜索进化记录" value="${esc(e.query)}" placeholder="搜索${type==='assets'?'记忆与规则':type==='traces'?'任务或 Agent':'改进内容'}"></label></div>`;}
function evolutionObserve(){const traces=evolutionRows('traces',false),feedback=traces.filter(t=>t.feedback).length;return `<div class="evo-work-head"><div><h2>看见每次执行与反馈</h2><p>输入、工具调用、执行结果与用户反馈，回到同一条记录。</p></div>${tag('最近执行记录','gray')}</div>${evolutionMetrics([['执行记录',traces.length,'次已记录'],['收到反馈',feedback,'条可追溯'],['关联改进',traces.filter(t=>t.proposalId).length,'项候选']])}${evolutionFilters('traces')}<div class="evo-panel evo-table-scroll"><table><thead><tr><th>任务 / 执行记录</th><th>Agent</th><th>状态</th><th>耗时 / Tokens</th><th>记录</th></tr></thead><tbody>${evolutionRows('traces').map(t=>`<tr><td><button class="evo-text-btn" data-a="evolution-trace" data-v="${t.id}">${esc(t.title)}</button><small>${t.id} · ${esc(t.scope)} · ${esc(t.time)}</small></td><td>${esc(t.agent)}</td><td>${tag(t.status,t.status==='已完成'?'green':t.status==='需关注'?'red':'gold')}</td><td>${t.duration}<small>${t.tokens.toLocaleString()} Tokens</small></td><td><button class="evo-text-btn" data-a="evolution-trace" data-v="${t.id}">查看轨迹${ico('arrow')}</button></td></tr>`).join('')||'<tr><td colspan="5">'+evolutionEmpty('没有匹配的执行记录。')+'</td></tr>'}</tbody></table></div>`;}
function evolutionScore(p){return p.evaluation?`<span class="evo-score">${p.evaluation.before}/${p.evaluation.total} ${ico('arrow')}<b class="${p.evaluation.passed?'':'evo-warning'}">${p.evaluation.after}/${p.evaluation.total}</b></span>`:'<span class="muted">待评估</span>';}
function evolutionEvaluatePage(){const proposals=evolutionRows('proposals',false).filter(p=>p.status!=='dismissed'),evaluated=proposals.filter(p=>p.evaluation);return `<div class="evo-work-head"><div><h2>每项改进，都有前后对照</h2><p>回放同一组用例，核对效果与关键约束，通过后再由人确认采纳。</p></div>${tag('先评估，再采纳','gray')}</div>${evolutionMetrics([['等待评估',proposals.filter(p=>!p.evaluation).length,'项待运行'],['通过评估',evaluated.filter(p=>p.evaluation.passed).length,'项可采纳'],['未通过约束',evaluated.filter(p=>!p.evaluation.passed).length,'项需改进']])}<div class="evo-panel evo-table-scroll"><table><thead><tr><th>改进候选</th><th>进化类型</th><th>用例通过数 · 当前 → 改进后</th><th>状态</th><th>操作</th></tr></thead><tbody>${proposals.map(p=>`<tr><td><button class="evo-text-btn" data-a="evolution-detail" data-v="${p.id}">${esc(p.title)}</button><small>${p.id} · ${esc(p.target)}</small></td><td>${evolutionStage(p).name}</td><td>${evolutionScore(p)}</td><td>${evolutionStatus(p)}</td><td>${['pending','blocked'].includes(p.status)?btn('运行回放评估','evolution-evaluate',p.id,'sm'):btn('查看评估','evolution-detail',p.id,'link sm')}</td></tr>`).join('')||'<tr><td colspan="5">'+evolutionEmpty('当前范围没有待评估的候选。')+'</td></tr>'}</tbody></table></div><p class="evo-note-line">${ico('shield')}保留用例结果、约束检查和确认记录；评估通过的候选仍需人工采纳。</p>`;}
function evolutionImprove(){const e=s.evolutionCenter,rows=evolutionRows();return `<div class="evo-work-head"><div><h2>${e.stage==='all'?'把反馈变成下一次的改进':EVO_STAGES.find(x=>x.id===e.stage)?.name||'下一步改进'}</h2><p>查看来源与建议变更，评估后选择采纳或暂不采纳。</p></div>${tag(rows.length+' 项改进','gray')}</div>${evolutionFilters('proposals')}<section class="evo-panel">${rows.map(evolutionProposalCard).join('')||evolutionEmpty('没有匹配的改进，可以调整筛选。')}</section>`;}
function evolutionMemoryPage(){const assets=evolutionRows('assets',false);return `<div class="evo-work-head"><div><h2>越用，越了解你的工作方式</h2><p>管理已确认的偏好、工作模板与协作规则，保留来源和版本。</p></div>${tag('可确认 · 可停用 · 可追溯','gray')}</div>${evolutionMetrics([['已确认',assets.filter(r=>r.state==='confirmed').length,'条正在生效'],['待确认',assets.filter(r=>r.state==='pending').length,'条由你判断'],['已停用',assets.filter(r=>r.state==='paused').length,'条保留历史']])}${evolutionFilters('assets')}<div class="evo-memory-grid">${evolutionRows('assets').slice().reverse().map(evolutionAssetCard).join('')||evolutionEmpty('没有匹配的记忆与规则。')}</div>`;}
function evolutionContent(){return ({overview:evolutionOverview,observe:evolutionObserve,evaluate:evolutionEvaluatePage,improve:evolutionImprove,memory:evolutionMemoryPage})[s.evolutionCenter.tab]();}
function renderEvolution(){normalizeEvolution();const e=s.evolutionCenter,personal=e.scope==='个人',pending=evolutionRows('proposals',false).filter(p=>['pending','ready','blocked'].includes(p.status)).length,scopeLabel=personal?'个人':e.scope==='all'?'全部范围':e.scope;return `<div class="demopage evolution-page"><header class="evo-page-head"><div><h1>进化中心${as2Hint(`当前范围：<b>${esc(scopeLabel)}</b> · ${personal?'个人私有，仅本人管理':e.scope==='all'?'按个人与项目范围隔离':'项目共享，成员协作'}。改进生效前都需要确认。`,'关于可见范围')}</h1><p>越用越了解你的工作偏好与目标。每项改进都有证据、评估和版本。</p></div><label class="evo-scope">${ico(personal?'home':'team')}<select id="evolutionScope" aria-label="进化范围"><option value="个人" ${personal?'selected':''}>个人 · 仅本人</option>${joinedProjects().map(p=>`<option value="${esc(p)}" ${e.scope===p?'selected':''}>${esc(p)} · 项目</option>`).join('')}<option value="all" ${e.scope==='all'?'selected':''}>全部范围</option></select></label></header><nav class="evo-tabs" role="tablist" aria-label="进化中心">${EVO_TABS.map(([id,label])=>`<button role="tab" class="${e.tab===id?'active':''}" id="evo-tab-${id}" aria-controls="evolutionContent" aria-selected="${e.tab===id}" tabindex="${e.tab===id?'0':'-1'}" data-a="evolution-tab" data-v="${id}">${label}${id==='improve'&&pending?`<span class="evo-count">${pending}</span>`:''}</button>`).join('')}<span class="evo-privacy">${ico('shield')}${personal?'个人私有 · 本人管理':e.scope==='all'?'按个人与项目范围隔离':'项目共享 · 成员协作'}</span></nav><div id="evolutionContent" role="tabpanel" aria-labelledby="evo-tab-${e.tab}">${evolutionContent()}</div></div>`;}
function evolutionDetail(id){const p=evolutionProposal(id);if(!p)return;const result=p.evaluation;modal('改进详情',`<div class="evo-detail"><div class="row wrap"><span class="evo-stage-tag">${evolutionStage(p).name}</span>${tag(esc(p.scope),'gray')}${evolutionStatus(p)}<span class="spacer"></span><small>${p.id}</small></div><h2>${esc(p.title)}</h2><p>${esc(p.observation)}</p><button class="evo-source-button" data-a="evolution-source" data-v="${p.id}">${ico('link')}来源：${esc(p.source.label)}${ico('arrow')}</button><div class="evo-comparison"><section><small>当前做法</small><p>${esc(p.before)}</p></section><section><small>建议改进</small><p>${esc(p.after)}</p></section></div><h3>前后对照评估 <span>固定回放用例</span></h3><p class="evo-detail-hint">${result?`当前 ${result.before}/${result.total} 项通过，改进后 ${result.after}/${result.total} 项通过。${result.passed?'关键约束通过，可确认采纳。':'关键约束仍有未通过项，需继续改进。'}`:'回放同一组用例，比较前后行为与关键约束。'}</p><div class="evo-eval-table"><table><thead><tr><th>检查项</th><th>当前</th><th>改进后</th></tr></thead><tbody>${p.cases.map(c=>`<tr><td>${esc(c.label)}${c.critical?'<small>关键约束</small>':''}</td><td>${result?evolutionCaseMark(c.before):'—'}</td><td>${result?evolutionCaseMark(c.after):'待评估'}</td></tr>`).join('')}</tbody></table></div><div class="evo-history"><h3>改进记录</h3>${p.history.map(h=>`<div><i></i><span>${esc(h.label)}</span><time>${esc(h.time)}</time></div>`).join('')}</div></div>`,`${['pending','ready','blocked'].includes(p.status)?btn('暂不采纳','evolution-dismiss',p.id,'link'):''}${btn('关闭','close-modal')}${['pending','blocked'].includes(p.status)?btn('运行回放评估','evolution-evaluate',p.id,'primary'):p.status==='ready'?btn('确认采纳','evolution-adopt',p.id,'primary'):p.status==='dismissed'?btn('重新打开','evolution-reopen',p.id,'sm'):p.status==='adopted'?btn('查看生效规则','evolution-asset','EXP-'+p.id,'primary'):''}`);$('.modal')?.classList.add('evolution-modal');}
function evolutionCaseMark(pass){return `<span class="evo-case ${pass?'pass':'fail'}">${ico(pass?'check':'close')}${pass?'通过':'未通过'}</span>`;}
function evolutionEvaluate(id){const p=evolutionProposal(id);if(!p||!['pending','blocked'].includes(p.status))return;const before=p.cases.filter(c=>c.before).length,after=p.cases.filter(c=>c.after).length,passed=p.cases.filter(c=>c.critical).every(c=>c.after)&&after>=before;p.evaluation={before,after,total:p.cases.length,passed,time:evolutionTime()};p.status=passed?'ready':'blocked';p.updated=p.evaluation.time;p.history.push({label:`完成回放评估 · ${before}/${p.cases.length} → ${after}/${p.cases.length}${passed?'':' · 关键约束未通过'}`,time:p.updated});render();evolutionDetail(id);}
function evolutionAdopt(id){const p=evolutionProposal(id);if(!p||p.status!=='ready'||!p.evaluation?.passed){notify('请先完成并通过评估。');return;}const e=s.evolutionCenter,assetId='EXP-'+p.id;if(!e.assets.some(r=>r.id===assetId))e.assets.push({id:assetId,title:p.title,scope:p.scope,target:p.target,stage:p.stage,kind:p.stage==='individual'?'工作模板':p.stage==='meta'?'执行策略':'协作协议',state:'confirmed',version:1,owner:p.owner,summary:p.after,content:p.after,source:{...p.source},proposalId:p.id,adoptedBy:'我',evaluation:{...p.evaluation},updated:evolutionTime(),versions:[{version:1,label:'评估通过，我确认采纳',time:evolutionTime(),content:p.after}]});p.status='adopted';p.adoptedBy='我';p.updated=evolutionTime();p.history.push({label:'我确认采纳 · 生效规则 v1',time:p.updated});render();evolutionDetail(id);notify('已采纳，来源、评估与版本已保留。');}
function evolutionAsset(id){normalizeEvolution();const r=s.evolutionCenter.assets.find(x=>x.id===id&&evolutionVisible(x));if(!r)return;modal('记忆与规则',`<div class="evo-detail"><div class="row wrap">${tag(esc(r.scope),'gray')}${tag(esc(r.kind),'gray')}${evolutionMemoryState(r)}<span class="spacer"></span>${r.version?tag('v'+r.version,'gray'):tag('尚未生效','gray')}</div><h2>${esc(r.title)}</h2><p class="evo-asset-content">${esc(r.content)}</p><div class="evo-asset-meta">来源：${esc(r.source.label)}<br>管理人：${esc(r.owner)}<br>更新：${esc(r.updated)}<br>生效范围：${esc(r.scope)}${r.evaluation?`<br>采纳依据：用例通过 ${r.evaluation.before}/${r.evaluation.total} → ${r.evaluation.after}/${r.evaluation.total}`:''}</div><h3 style="margin-top:22px">版本记录</h3>${r.versions.length?r.versions.slice().reverse().map(v=>`<div class="evo-version-row"><b>v${v.version} · ${esc(v.label)}</b><small>${esc(v.time)}</small><p>${esc(v.content||'')}</p></div>`).join(''):'<p class="evo-detail-hint">确认后形成首个生效版本。</p>'}</div>`,`${btn('查看来源','evolution-source',r.id,'link')}${btn('关闭','close-modal')}${r.proposalId?btn('查看采纳记录','evolution-detail',r.proposalId,'sm'):''}${btn(r.state==='pending'?'确认记忆':r.state==='paused'?'重新启用':'停用这条规则',r.state==='pending'?'evolution-memory-confirm':'evolution-memory-toggle',r.id,r.state==='confirmed'?'':'primary')}`);$('.modal')?.classList.add('evolution-modal');}
function evolutionTrace(id){normalizeEvolution();const t=s.evolutionCenter.traces.find(x=>x.id===id&&evolutionVisible(x));if(!t)return;modal('执行记录',`<div class="evo-detail"><div class="row wrap">${tag(esc(t.scope),'gray')}${tag(esc(t.status),t.status==='已完成'?'green':'gold')}<span class="spacer"></span><small>${t.id}</small></div><h2>${esc(t.title)}</h2><div class="evo-detail-strip">${ico('clock')}${esc(t.time)} · ${t.duration}<span class="spacer"></span>${esc(t.agent)} · ${t.tokens.toLocaleString()} Tokens</div><h3>执行轨迹</h3>${t.steps.map(([title,desc],i)=>`<div class="evo-trace-step"><i>${i+1}</i><div><b>${esc(title)}</b><p>${esc(desc)}</p></div></div>`).join('')}<h3 style="margin-top:20px">任务反馈</h3><p class="evo-asset-content">${esc(t.feedback||'本次执行暂无新增反馈。')}</p></div>`,`${btn('查看来源','evolution-source',t.id,'link')}${btn('关闭','close-modal')}${t.proposalId?btn('查看关联改进','evolution-detail',t.proposalId,'primary'):''}`);$('.modal')?.classList.add('evolution-modal');}
function evolutionOpenSource(id){normalizeEvolution();const row=evolutionProposal(id)||s.evolutionCenter.assets.find(r=>r.id===id&&evolutionVisible(r))||s.evolutionCenter.traces.find(r=>r.id===id&&evolutionVisible(r));if(!row)return;const source=row.source;document.body.classList.remove('mobile-nav');closeModal();if(source.type==='thread')openProjectThread(source.key,source.project);else if(source.type==='bench')action('open-bench',source.id);}
function evolutionAction(a,v){normalizeEvolution();const e=s.evolutionCenter;switch(a){
 case 'evolution':case 'evolution-tab':openEvolution(v);break;
 case 'evolution-return':evolutionReturn();break;
 case 'evolution-stage':openEvolution('improve');e.stage=v;render();break;
 case 'evolution-metric':openEvolution(v.split('|')[0]==='library'?'memory':'improve');break;
 case 'evolution-reset':e.status='all';e.stage='all';e.query='';e.memoryState='all';e.traceStatus='all';render();break;
 case 'evolution-detail':evolutionDetail(v);break;
 case 'evolution-evaluate':evolutionEvaluate(v);break;
 case 'evolution-adopt':evolutionAdopt(v);break;
 case 'evolution-asset':evolutionAsset(v);break;
 case 'evolution-trace':evolutionTrace(v);break;
 case 'evolution-source':evolutionOpenSource(v);break;
 case 'evolution-memory-confirm':case 'evolution-memory-toggle':{const r=e.assets.find(x=>x.id===v&&evolutionVisible(x));if(!r)break;const confirming=r.state==='pending';r.state=confirming||r.state==='paused'?'confirmed':'paused';r.version=(r.version||0)+1;r.updated=evolutionTime();r.versions.push({version:r.version,label:confirming?'我确认了这条记忆':r.state==='paused'?'停用，保留历史':'重新启用',time:r.updated,content:r.content});render();evolutionAsset(v);notify(confirming?'已确认记忆。':r.state==='paused'?'已停用，版本记录已保留。':'已重新启用。');break;}
 case 'evolution-dismiss':case 'evolution-reopen':{const p=evolutionProposal(v);if(!p||p.status==='adopted')break;p.status=a==='evolution-dismiss'?'dismissed':'pending';if(a==='evolution-reopen')delete p.evaluation;p.updated=evolutionTime();p.history.push({label:a==='evolution-dismiss'?'暂不采纳，保留依据与记录':'重新打开，等待评估',time:p.updated});render();evolutionDetail(v);break;}
}}
document.addEventListener('change',event=>{const fields={evolutionScope:'scope',evolutionStatus:'status',evolutionStage:'stage',evolutionMemoryState:'memoryState',evolutionTraceStatus:'traceStatus'},field=fields[event.target.id];if(!field)return;normalizeEvolution();const e=s.evolutionCenter;e[field]=event.target.value;if(field==='scope'){e.status='all';e.stage='all';e.query='';e.memoryState='all';e.traceStatus='all';}render();});

function appearanceConfig(){
  if(!s.appearance||typeof s.appearance!=='object'||Array.isArray(s.appearance))s.appearance={};
  const value=Number(s.appearance.transparency);
  s.appearance.transparency=Number.isFinite(value)?Math.max(0,Math.min(60,Math.round(value))):20;
  if(s.appearance.style==='system')s.appearance.style=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'classic';if(!Object.hasOwn(APPEARANCE_STYLES,s.appearance.style))s.appearance.style='liquid';
  if(!Object.hasOwn(APPEARANCE_COLORS,s.appearance.color))s.appearance.color='purple';
  return s.appearance;
}
function appearanceApply(){settingsApply();

  root.dataset.appearanceStyle=style;root.dataset.appearanceColor=color;
  root.dataset.appearanceTone=themeTone(style);root.dataset.theme=themeTone(style);root.classList.toggle('dark',themeTone(style)==='dark');
  root.style.colorScheme=themeTone(style);
  root.style.setProperty('--ap-hue',APPEARANCE_COLORS[color].hue);
  root.style.setProperty('--ap-companion-hue',APPEARANCE_COLORS[color].companionHue);
  root.style.setProperty('--ap-surface-alpha',(1-transparency/100).toFixed(2));
  root.style.setProperty('--ap-card-alpha',(1-transparency*.0085).toFixed(3));
  root.style.setProperty('--ap-rail-alpha',(1-transparency*.003).toFixed(3));
  root.style.setProperty('--ap-slider-progress',(transparency/60*100).toFixed(3)+'%');
  const slider=$('#appearanceTransparency'),value=$('#appearanceValue'),themeName=$('#appearanceThemeName'),description=$('#appearanceStyleDescription');
  if(slider){slider.value=transparency;slider.setAttribute('aria-valuetext',transparency+'% 透明');}
  if(value)value.textContent=transparency+'%';
  if(themeName)themeName.textContent=APPEARANCE_STYLES[style].name+'主题';
  if(description)description.textContent=APPEARANCE_STYLES[style].description;
  for(const [key,selected]of [['style',style],['color',color],['preset',String(transparency)]]){
    $$('[data-a="appearance-'+key+'"]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.v===selected?'true':'false'));
  }
}

g(s.paused.includes(b.id)?'已暂停':'已启用',s.paused.includes(b.id)?'gray':'green')}</div><div class="rule"></div><div class="grid2"><div><h4>输入与接收位置</h4><p style="margin-top:8px">范围：${esc(b.range)}<br>输出：当前工作台 / 本人摘要<br>数据截止：执行前一天 24:00（当地时区）</p></div><div><h4>最近运行</h4><p style="margin-top:8px">R-${b.id}-1027 · 成功<br>最近更新：${esc(b.updated)}<br>异常时保留最近成功结果并提示</p></div></div><div class="row wrap" style="margin-top:24px">${btn(s.paused.includes(b.id)?'恢复更新':'暂停更新','pause-bench',b.id)}${btn('修改频率','schedule-bench',b.id)}${btn('打开 Workflow','studio',b.workflow,'primary')}</div></div>`:`<div class="benchdetail"><div><div class="minimetrics">${b.metrics.map(([n,l])=>`<div><b>${n}</b><small>${l}</small></div>`).join('')}</div><div class="card" style="margin-top:18px"><div class="row between"><h3>需要关注</h3>${tag('示例数据','gray')}</div>${(b.id==='repo'?[['MR !1284 · 补充并发重试用例','检视未覆盖缓存失效后的重入情况。'],['MR !1288 · CI 回归失败','需要定位两项集成测试差异。']]:b.id==='fleet'?[['区域 A · BMC 版本分布异常','同机型存在多个固件版本，建议按批次复核。'],['区域 B · 新增风险机器','与上一批次比较后有 7 台需要确认。']]:[['发布前回归结果待确认','2 项阻塞问题需要责任人补充验证证据。'],['RR-124 · 需求范围变更','验收条件已变化，建议重新核对用例范围。']]).map(([h,p])=>`<div class="sourceitem"><div class="grow"><b>${h}</b><small>${p}</small></div>${btn('追问','bench-ask',b.id,'link sm')}</div>`).join('')}</div><div class="note" style="font-size:11px;margin-top:18px">最后成功更新：${esc(b.updated)}。每条结论保留来源引用；完整证据按用户授权展示。</div></div><div class="card"><h3>数据与更新</h3>${sourceRows(b.sources)}<div style="margin-top:15px">${tag(s.paused.includes(b.id)?'自动更新已暂停':'每日 Workflow 更新',s.paused.includes(b.id)?'gray':'green')}</div><div class="row wrap" style="margin-top:14px">${btn('查看配置','bench-tab','schedule','sm')}${btn('查看来源','bench-tab','sources','sm')}</div></div></div>`}`;}

function renderAssistant(){return `<div class="assistantwrap"><div class="row between"><div class="kicker">临时任务</div>${btn('新会话','new-conversation','','sm')}</div>${!s.assistantMessages.length?`<div class="assistantintro"><div class="spark">${ico('spark')}</div><h2>嗨，有什么一起搞定？</h2><p>一个临时想法，一份待办，或一项需要专心推进的工作。</p><div class="suggests">${['分析今天合入 MR 的检视风险','汇总这份报告的关键结论','给 AICS 设计一个接入方案'].map(x=>`<button data-a="assistant-example" data-v="${x}">${x}</button>`).join('')}</div></div>`:''}<div class="chatmsgs">${s.assistantMessages.map(m=>`<div class="chatbubble ${m.who==='me'?'mine':''}"><small>${m.who==='me'?'我':'个人助理'} · 仅自己可见</small>${esc(m.text)}${m.taskId?assistantTaskCard(m.taskId):''}</div>`).join('')}</div><div class="composer"><img class="nt-hero as-hero" src="${newTaskHero()}" alt="" aria-hidden="true"><textarea id="assistantInput" aria-label="给个人助理的任务" placeholder="描述你的临时任务，或引用工作台里的某条结果…">${esc(s.assistantDraft||'')}</textarea><div class="composerfoot"><span>个人会话 · 按需创建任务 · 结果可追溯</span>${btn(ico('send')+'发送','assistant-send','','primary')}</div></div><p class="tiny muted" style="font-size:11px;margin-top:9px">Enter 发送 · Shift + Enter 换行。确认执行前可查看目标、范围和产物。</p></div>`;}

function wb2Resolve(e,prompt){wb2Normalize(e);const text=prompt.toLowerCase();if(e.project==='global'){const mentioned=joinedProjects().find(p=>text.includes(p.toLowerCase()));if(mentioned)e.project=mentioned;}const available=wb2Available(e),map=new Map(available.map(i=>[i.assetId,i])),selected=e.extensionIds.filter(id=>map.has(id)),mentionedMissing=[];for(const a of AGENTCENTER_ASSETS){const at=text.indexOf(a.name.toLowerCase());if(at<0)continue;if(/不用|不使用|移除|去掉|删除/.test(text.slice(Math.max(0,at-12),at))){const n=selected.indexOf(a.id);if(n>=0)selected.splice(n,1);e.excludedExtensions=[...new Set([...e.excludedExtensions,a.id])];}else if(map.has(a.id)){if(!selected.includes(a.id))selected.push(a.id);}else mentionedMissing.push(a.id);}let profile=/现网|机型|bmc|资产|巡检/.test(text)?'fleet':/仓库|\bmr\b|合入|检视/.test(text)?'repo':/构建|构筑|构建日志|\bci\b/.test(text)?'build':/质量|发布风险|阻塞|测试报告/.test(text)?'qa':e.intentProfile||'custom';e.intentProfile=profile;const fileOnly=e.files.length&&!selected.some(id=>['MCP','CLI'].includes(asset(id)?.type)),required=fileOnly?[]:profile==='qa'?['ac-mcp-quality']:profile==='repo'?['ac-mcp-codehub']:profile==='fleet'?['ac-mcp-assets']:profile==='build'?['ac-cli-cloudbuild']:[],preferred=profile==='qa'?['ac-skill-quality']:profile==='repo'?['ac-skill-review']:[];const missing=[...mentionedMissing];for(const id of required){if(!map.has(id)||e.excludedExtensions.includes(id)){if(!missing.includes(id))missing.push(id);}else if(!selected.includes(id))selected.push(id);}for(const id of preferred)if(map.has(id)&&!e.excludedExtensions.includes(id)&&!selected.includes(id))selected.push(id);for(const id of e.extensionIds)if(!map.has(id)&&!missing.includes(id))missing.push(id);e.extensionIds=[...new Set(selected)];const refs=wb2Refs(e);e.sources=wb2Sources(refs);if(!e.range.trim())e.range=e.files.length&&!e.sources.length?'导入文件 / 当前资料':e.project==='global'?'个人 / 当前关注范围':e.project+' / 当前迭代';e.allowEmpty=refs.length>0&&!e.sources.length;return {missing,refs,needsInput:!refs.length&&!e.files.length&&!e.allowEmpty,profile};}
function wb2Plan(e){const pending=e.pendingPlan||{prompt:e.input||'',missing:[],needsInput:true},refs=wb2Refs(e),data=refs.filter(r=>r.type!=='Skill'),skills=refs.filter(r=>r.type==='Skill');return `<section class="wc-plan"><h2>把目标，交给合适的扩展</h2><p>${esc(pending.prompt||'描述你希望持续关注的工作。')}</p><div class="wc-plan-items">${[[data.length?'读取所选数据':'连接工作数据',data.map(r=>r.name).join('、')||(e.files.length?e.files.map(f=>f.name).join('、'):'选择已安装的 MCP / CLI，或导入文件。')],[skills.length?'使用 Skill 处理':'组织工作结果',skills.map(r=>r.name).join('、')||'根据你的描述归纳指标、风险与后续动作。'],['生成可持续修改的工作台','预览布局与来源，在同一会话继续修改，满意后采用。']].map(([title,desc],i)=>`<div class="wc-plan-step"><i>${i+1}</i><div><b>${esc(title)}</b><small>${esc(desc)}</small></div></div>`).join('')}</div>${pending.missing?.length?`<div class="wc-plan-missing">当前范围还需要：${pending.missing.map(id=>esc(asset(id)?.name||id)).join('、')}。<br>添加后可返回当前会话继续生成。<div class="row">${btn('前往扩展添加','wb2-manage-extensions',pending.missing[0],'sm')}${btn('调整引用','wb2-picker','extensions','link sm')}</div></div>`:''}<div class="wc-plan-actions">${btn('继续生成预览','wb2-run-pending','','primary')}${!refs.length&&!e.files.length?btn('先生成布局','wb2-empty-layout','','link sm'):''}</div></section>`;}

function renderWorkbenchBuilder(){const e=wb2Current();if(!e)return '';if(!e.versions.length&&!e.messages.length)return wb2Start(e);const v=wbVersion(e),current=v&&v.version===e.adopted,historical=v?.adopted&&!current;return `<div class="wb-editor wc-editor" data-workbench-id="${esc(e.benchId||s.workbenchEditorKey||'new')}" data-mobile="${e.mobile||'chat'}"><header class="wb-editor-header"><button class="wb-back" data-a="wb-back">${ico('back')}<span>我的工作台</span></button><span class="wb-header-divider"></span><input class="wb-name" id="wbName" aria-label="工作台名称" placeholder="正在构建工作台" value="${esc(e.title)}"><span class="wb-save-status">${ico('check')}草稿已保存</span><div class="wb-header-actions">${e.adopted?tag('当前 V'+e.adopted,'green'):tag('未采用','gray')}${e.benchId?btn('打开工作台','open-bench',e.benchId,'link sm'):''}<button class="btn primary sm" data-a="${historical?'wb-version-restore':'wb2-adopt'}" data-v="${v?.version||''}" ${!v||current||e.busy?'disabled':''}>${current?'已采用 V'+v.version:historical?'恢复为新版本':v?'采用 V'+v.version:'采用工作台'}</button></div></header><div class="wb-mobile-switch"><button class="${e.mobile!=='preview'?'active':''}" data-a="wb-mobile" data-v="chat">描述与修改</button><button class="${e.mobile==='preview'?'active':''}" data-a="wb-mobile" data-v="preview">工作台预览${v?' · V'+v.version:''}</button></div><div class="wb-editor-body"><section class="wb-conversation"><header class="wb-conversation-head"><h2>${e.benchId?'让工作台，继续适应你':'一起构建你的工作台'}</h2><p>${esc(wb2ProjectLabel(e.project))} · 在会话中引用扩展，持续生成和修改。</p>${wbhEditorLine(e)}</header><div class="wb-conversation-scroll"><div id="wbMessages">${wbMessages(e)}</div></div><footer class="wb-composer-area">${v?`<div class="wc-editing-caption">${ico('refresh')}基于 V${wbhEditBase(e)?.version||v.version} 继续修改 · ${e.adopted?'当前采用 V'+e.adopted:'尚未采用'}</div><div class="wb-prompt-suggestions">${['把阻塞项放在最前面','增加最近 7 天风险趋势','改成两列展示'].map(t=>`<button data-a="wb-prompt" data-v="${t}">${t}</button>`).join('')}</div>`:''}${e.bench async function wb2Send(pending=false,allowEmpty=false){const e=wb2Current();if(!e||e.busy)return;const editBase=wbhEditBase(e);if(editBase)e.selected=editBase.version;const input=pending?e.pendingPlan?.prompt:e.input?.trim();if(!input)return;const resolved=wb2Resolve(e,input);if(allowEmpty){e.allowEmpty=true;resolved.needsInput=false;resolved.missing=[];e.sources=[];e.range=e.project==='global'?'个人 / 布局预览':e.project+' / 布局预览';}if(resolved.missing.length||resolved.needsInput){if(pending){e.pendingPlan={prompt:input,missing:resolved.missing,needsInput:resolved.needsInput};render();notify(resolved.missing.length?'请先添加所需扩展，或调整引用。':'请选择扩展或文件，也可以先生成布局。');}else wb2GenerateMessage(e,input,resolved);return;}e.input=input;e.popover=null;const bindings=wb2Refs(e),project=e.project;e.pendingPlan=null;await wbGenerateCore(pending);const last=e.messages.at(-1);if(last?.role==='assistant'&&last.version){last.bindings=bindings;last.project=project;}render();wbAfterRender(true);}

function wbhNormalize(record){record.messages=record.messages||[];record.versions=record.versions||[];record.messages.forEach((m,i)=>{if(!m.id)m.id='build-message-'+(i+1);});for(const v of record.versions){const index=record.messages.findIndex(m=>m.role==='assistant'&&m.version===v.version);if(index<0)continue;v.messageId=record.messages[index].id;if(/^恢复 V/.test(v.change||'')){delete v.requestMessageId;continue;}const request=record.messages.slice(0,index).reverse().find(m=>m.role==='user');if(request)v.requestMessageId=request.id;}return record;}
function wbhData(b){wbEnsureBench(b);const existing=s.workbenchEditors?.[b.id];if(existing)return wbhNormalize(existing);const messages=b.conversation?.length?b.conversation:[{role:'user',text:b.prompt,created:'此前'},{role:'assistant',text:'已生成工作台，当前采用 V'+b.version+'。',version:b.version,created:b.updated||'此前'}];return wbhNormalize({benchId:b.id,title:b.title,versions:b.history,adopted:b.version,selected:b.version,messages,input:'',project:b.project||'global'});}
function wbhState(id){s.workbenchHistoryUI=s.workbenchHistoryUI||{};return s.workbenchHistoryUI[id]||(s.workbenchHistoryUI[id]={pane:'conversation',focusVersion:null});}
function wbhVersionState(record,v){return v.version===record.adopted?'当前已采用':v.adopted?'曾采用':v.version>(record.adopted||0)?'待采用预览':'未采用';}
function wbhPending(record){return record.versions.filter(v=>!v.adopted&&v.version>(record.adopted||0));}
function wbhHistoryActions(record,v,detailId){const suffix=detailId?detailId+':'+v.version:v.version;return `${btn('预览',detailId?'wb-open-version':'wb-version-preview',suffix,'sm')}${v.messageId?btn('对应对话',detailId?'wbh-detail-related':'wbh-editor-related',suffix,'link sm'):''}${v.adopted&&v.version!==record.adopted?btn('恢复为新版本',detailId?'wb-detail-restore':'wb-version-restore',suffix,'link sm'):''}`;}
function wbVersionList(record,detailId){wbhNormalize(record);return `<div class="wb-pane-title"><h2>版本记录</h2><p>${record.versions.length} 个版本 · ${record.adopted?'当前采用 V'+record.adopted:'尚未采用'}</p></div><div class="wb-version-summary">每次生成保留项目、扩展、文件与布局快照。“对应对话”可定位当时的修改要求；预览后可基于该版本继续修改。</div>${record.versions.slice().reverse().map(v=>`<article class="wb-version-row ${record.selected===v.version?'selected':''}" data-history-version="${v.version}"><span class="wb-version-badge">V${v.version}</span><div class="grow"><div class="row"><b>${esc(v.title)}</b>${tag(wbhVersionState(record,v),v.version===record.adopted?'green':v.adopted||v.version<(record.adopted||0)?'gray':'gold')}</div><p>${esc(v.change||'首次生成')}</p><small>${esc(v.created)} · ${v.baseVersion?'基于 V'+v.baseVersion+' · ':''}${v.extensions?.length||0} 项扩展 · ${v.files.length} 份文件</small></div><div class="wb-version-actions">${wbhHistoryActions(record,v,detailId)}</div></article>`).join('')}`;}
function wbMessages(record){wbhNormalize(record);if(!record.messages.length)return '';const selected=record.versions.find(v=>v.version===Number(record.highlightVersion)),related=new Set([selected?.messageId,selected?.requestMessageId].filter(Boolean));return record.messages.map(m=>`<article class="wb-message ${m.role==='user'?'me':''} ${related.has(m.id)?'related-message':''}" data-message-id="${esc(m.id)}" ${m.version?'data-message-version="'+m.version+'"':''}><header>${m.role==='assistant'?`<span class="wb-agent-face">${ico('spark')}</span>`:''}${m.role==='user'?'我':'AgentSpace'}<small>${esc(m.created||'')}</small></header><p>${esc(m.text)}</p>${m.context?`<div class="wb-message-context">${m.baseVersion?'基于 V'+m.baseVersion+' · ':''}${esc(m.context)}</div>`:''}${m.bindings&&!record.compact?wb2BindingSummary(m.bindings,m.project):''}${m.pending&&!record.readOnly?`<div class="wc-binding-summary">${m.missing?.length?'待添加扩展：'+m.missing.map(id=>esc(asset(id)?.name||id)).join('、'):'可选择扩展或导入文件，补充数据与处理方法。'}<div class="row wrap" style="margin-top:10px">${btn('选择扩展','wb2-picker','extensions','sm')}${m.missing?.length?btn('前往扩展添加','wb2-manage-extensions',m.missing[0],'link sm'):''}</div></div>`:''}${m.version?wbMessageVersion(record,m.version):''}</article>`).join('');}
function wbhStrip(b,record){const pending=wbhPending(record),latest=pending.at(-1),last=record.messages.at(-1);return `<div class="wbh-resume-strip">${ico('clock')}<strong>当前采用 V${b.version}</strong>${latest?tag('待采用 V'+latest.version,'gold'):''}<small>上次构建 ${esc(last?.created||b.updated)} · ${record.messages.length} 条对话 · ${record.versions.length} 个版本${record.input?.trim()?' · 有未发送草稿':''}</small><span class="spacer"></span>${btn('查看构建历史','wbh-open-history',b.id,'link sm')}</div>`;}
function wbhVersionPanel(b,record,ui){return `<section class="wbh-history-panel wbh-versions-panel"><header class="wbh-panel-head"><div><h3>历史版本 <span>${record.versions.length}</span></h3><small>当前已采用 V${record.adopted}</small></div>${ico('clock')}</header><div class="wbh-version-list">${record.versions.slice().reverse().map(v=>`<article class="wbh-version-item ${ui.focusVersion===v.version?'selected':''}" data-history-version="${v.version}"><header><b>V${v.version}</b>${tag(wbhVersionState(record,v),v.version===record.adopted?'green':v.adopted||v.version<(record.adopted||0)?'gray':'gold')}</header><p>${esc(v.change||'首次生成')}</p><small>${esc(v.created)} · ${v.baseVersion?'基于 V'+v.baseVersion+' · ':''}${v.extensions?.length||0} 项扩展 · ${v.files.length} 份文件</small><footer>${wbhHistoryActions(record,v,b.id)}</footer></article>`).join('')}</div></section>`;}
function wbhHistory(b,record){const ui=wbhState(b.id),focus=record.versions.find(v=>v.version===ui.focusVersion);return `<section class="wbh-history" data-workbench-id="${b.id}" data-pane="${ui.pane}"><header class="wbh-history-intro"><div><h2>一个工作台，一段持续的构建对话</h2><p>创建、调整与版本变更都留在这里。选择历史版本，可以预览当时的结果并查看对应对话。</p></div>${btn('继续修改','wbh-continue',b.id,'primary sm')}</header><nav class="wbh-mobile-tabs"><button class="${ui.pane==='conversation'?'active':''}" data-a="wbh-pane" data-v="${b.id}:conversation">对话记录 · ${record.messages.length}</button><button class="${ui.pane==='versions'?'active':''}" data-a="wbh-pane" data-v="${b.id}:versions">版本历史 · ${record.versions.length}</button></nav><div class="wbh-history-grid"><section class="wbh-history-panel wbh-conversation-panel"><header class="wbh-panel-head"><div><h3>构建对话 <span>${record.messages.length}</span></h3><small>${esc(b.title)} · 独立会话</small></div>${btn('回到开始','wbh-start',b.id,'link sm')}</header>${focus?`<div class="wbh-focus-line">${ico('link')}已定位 V${focus.version} 的生成与修改记录<button data-a="wbh-clear-focus" data-v="${b.id}">查看最近对话</button></div>`:''}<div class="wbh-message-list">${wbMessages({...record,readOnly:true,highlightVersion:ui.focusVersion})}</div></section>${wbhVersionPanel(b,record,ui)}</div></section>`;}
function wbRenderDetail(b){const record=wbhData(b),current=record.versions.find(v=>v.version===b.version)||b.history.find(v=>v.version===b.version)||b.history[0],content=s.benchTab==='sources'?wbSourcesPage(current):s.benchTab==='versions'?wbhHistory(b,record):`${wbhStrip(b,record)}${wbDashboard(current)}`;return `<div class="demohead"><div>${btn(ico('back')+'全部工作台','nav-personal','benches','link sm')}<h1 style="margin-top:9px">${esc(b.title)}</h1><p>${esc(b.range)} · 已采用 V${b.version} · 独立构建会话</p></div><div class="row wrap">${btn(ico('refresh')+'立即更新','bench-run',b.id)}${btn('继续修改','wbh-continue',b.id,'primary')}</div></div><div class="dtabs">${[['result','工作台'],['sources','引用与扩展'],['versions','会话与版本'],['schedule','Workflow 与更新']].map(([id,label])=>`<button class="${s.benchTab===id?'active':''}" data-a="bench-tab" data-v="${id}">${label}${id==='versions'?` <small>${record.versions.length}</small>`:''}</button>`).join('')}</div>${content}`;}

function wbhCardDraft(b){const record=s.workbenchEditors?.[b.id],pending=record?.versions.filter(v=>!v.adopted&&v.version>b.version);return pending?.length?`<span class="wbh-card-draft">V${pending.at(-1).version} 待采用</span>`:'';}
function wbhCapture(){const history=$('.wbh-history[data-workbench-id]'),list=history?.querySelector('.wbh-message-list');if(history&&list)wbhState(history.dataset.workbenchId).listScroll=list.scrollTop;const editor=$('.wc-editor[data-workbench-id]'),stream=editor?.querySelector('.wb-conversation-scroll'),record=editor&&s.workbenchEditors?.[editor.dataset.workbenchId];if(record&&stream)record.conversationScroll=stream.scrollTop;}

function wbhAction(action,value){switch(action){case 'wbh-edit-from':wbhEditFrom(value);break;case 'wbh-continue':{wbOpenExisting(value);break;}case 'wbh-open-history':{s.view='personal';s.page='benchdetail';s.personalPage='benches';s.selectedBench=value;s.benchTab='versions';const ui=wbhState(value);ui.pane='conversation';ui.focusVersion=null;ui.scrollTarget='end';render();break;}case 'wbh-detail-related':{const [id,n]=value.split(':');s.view='personal';s.page='benchdetail';s.selectedBench=id;s.benchTab='versions';const ui=wbhState(id);ui.focusVersion=Number(n);ui.pane='conversation';ui.scrollTarget='version';render();break;}case 'wbh-editor-related':{const record=wbCurrent();record.highlightVersion=Number(value);record.scrollToVersion=Number(value);record.mobile='chat';render();break;}case 'wbh-pane':{const [id,pane]=value.split(':');wbhState(id).pane=pane;render();break;}case 'wbh-start':{const ui=wbhState(value);ui.scrollTarget='start';ui.focusVersion=null;render();break;}case 'wbh-clear-focus':{const ui=wbhState(value);ui.focusVersion=null;ui.scrollTarget='end';render();break;}}}
function wbhSeed(){if(s.workbenchHistoryPresentationSeeded)return;s.workbenchHistoryPresentationSeeded=true;const b=s.benches.find(b=>b.id==='qa'),old=s.workbenchEditors?.qa;if(!b||b.version!==1||b.title!=='容器质量日报'||(b.history?.length||0)>1||b.conversation?.length||old||b.prompt!=='每天汇总当前迭代质量与发布风险，优先展示阻塞项和责任人。')return;const sources=['quality','issues'],refs=effectiveInstallations('AICS').filter(i=>['ac-mcp-quality','ac-skill-quality'].includes(i.assetId)).map(i=>{const a=asset(i.assetId);return {installationId:i.id,assetId:a.id,name:a.name,type:a.type,version:i.version,scope:i.scope,project:i.project,description:a.desc,icon:a.icon};});if(refs.length!==2)return;const prompts=['每天汇总 AICS 容器平台的质量与发布风险，列出阻塞项和责任人。','质量日报先给失败证据与复现步骤，再给结论；保留责任人和来源。','增加最近 7 天的风险趋势，改成两列展示。'],times=['今天 09:10','今天 09:26','今天 10:05'];let base=null;const versions=prompts.map((prompt,i)=>{const config=wbConfig(base?.config,prompt,sources,[],b.title),v={version:i+1,title:b.title,range:'AICS / 当前迭代',sources:wbClone(sources),files:[],extensions:wbClone(refs),project:'AICS',config,metrics:wbClone(b.metrics),prompt:prompts[0],instructions:prompts.slice(0,i+1),change:prompt,baseVersion:i||null,created:times[i],adopted:i<2};base=v;return v;});const messages=prompts.flatMap((text,i)=>[{role:'user',text,baseVersion:i||null,context:'AICS · 2 项扩展 · 0 份文件',created:times[i]},{role:'assistant',text:i===0?'已生成 V1，汇总质量风险与待确认事项。':i===1?'已按反馈更新报告结构，生成 V2。失败证据、复现步骤、责任人与来源一起呈现。':'已生成 V3 预览，增加风险趋势并调整为两列。目前工作台仍采用 V2，可继续修改后再采用。',version:i+1,bindings:wbClone(refs),project:'AICS',created:times[i]}]);const record=wbhNormalize({benchId:b.id,title:b.title,range:'AICS / 当前迭代',sources:wbClone(sources),files:[],extensions:wbClone(refs),extensionIds:refs.map(r=>r.assetId),project:'AICS',referenceSchema:1,versions,selected:3,adopted:2,messages,input:'把待确认的问题单独放在一组，补充下一步验证动作。',previewTab:'preview',mobile:'chat',contextDirty:false,excludedExtensions:[],sourcesOpen:false});s.workbenchEditors=s.workbenchEditors||{};s.workbenchEditors.qa=record;Object.assign(b,{version:2,range:record.range,sources:wbClone(sources),sourceCount:2,project:'AICS',extensions:wbClone(refs),history:wbClone(versions),conversation:wbClone(messages),prompt:versions[1].instructions.join('\n'),change:prompts[1],workbenchConfig:wbClone(versions[1].config),updated:times[1]});}

function wbhEditBase(record){if(!record?.versions?.length)return null;if(!record.editBaseVersion)record.editBaseVersion=record.versions.at(-1).version;return record.versions.find(v=>v.version===record.editBaseVersion)||record.versions.at(-1);}

function settingsAction(a,v){

// ---- Run view (AS2 · 执行可见性): Thinking Loader → Task List → Tool Call Group, plus 停止.
// Simulated: steps advance by elapsed time from startTask; the last step waits for “推进演示”.
// Density ladder: compact (inside task cards) = one line + progress; full (task detail / Thread) = steps + tool calls.
// Functions, not consts: runView() can run during the first render, before this block executes.
function runStepMs(){return 7000;}
function runUIState(){return window.__asRunUI||(window.__asRunUI={closed:{},open:{},plan:{},reason:{}});}
function runPlan(t){
  if(t.kind==='spec')return [
    ['读取需求与讨论','thread.read','需求 #206 · 12 条讨论',{thread:'requirement',limit:50},{messages:12,attachments:2}],
    ['生成 Spec 与设计','specx.generate','resource-priority-spec.md',{template:'SpecX v1.4',target:'V'+t.rev},{file:'resource-priority-spec.md',sections:7}],
    ['等待 Owner 确认','owner.review','需求 Owner 审阅',{reviewer:t.owner},{status:'pending'}],
    ['开发与测试','codehub.mr','MR !412 · 测试报告',{branch:'feat/resource-priority'},{mr:'!412',tests:'32/32'}]];
  if(t.kind==='performance')return [
    ['定位重复资源查询','logs.search','检索近 3 天任务列表日志',{service:'task-list',range:'3d',query:'duplicate resource query'},{hits:128,suspect:'ResourceRepo.findAll'}],
    ['复现翻页性能问题','sandbox.run','P95 2.4s · 已复现',{script:'bench/page.ts',pages:20},{p95:'2.4s',reproduced:true}],
    ['修复并生成补丁','repo.patch','performance-fix.diff · 3 个文件',{files:['ResourceRepo.ts','TaskList.tsx','cache.ts']},{diff:'performance-fix.diff',added:42,removed:17}],
    ['运行回归测试','ci.test','32 / 32 通过 · P95 640ms',{suite:'task-list',cases:32},{passed:32,failed:0,p95:'640ms'}]];
  return [
    ['读取授权资料','space.search','项目知识库 · 6 条资料',{space:t.scope,query:t.title},{documents:6}],
    ['抽取关键信息','doc.extract','MR 12 条 · CI 4 次',{sources:6},{mr:12,ci:4}],
    ['交叉核对证据','ci.query','关联 4 次构建',{builds:4},{matched:4,missing:0}],
    ['撰写结论','report.write','分析报告 V'+t.rev,{format:'report'},{file:'analysis-report.md'}]];
}
function runIndex(t){const n=runPlan(t).length;if(!t.runStartedAt)t.runStartedAt=Date.now()-2.5*runStepMs();return Math.min(n-1,Math.floor((Date.now()-t.runStartedAt)/runStepMs()));}
function runClock(ms){const sec=Math.max(0,Math.round(ms/1000));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function runDuration(ms){const sec=Math.max(1,Math.round(ms/1000));return sec<60?sec+' 秒':Math.floor(sec/60)+' 分 '+(sec%60)+' 秒';}
function runJSON(o){return esc(JSON.stringify(o,null,2)).replace(/&quot;([^&]*?)&quot;(\s*:)/g,'<span class="tk-key">"$1"</span>$2').replace(/: &quot;([^&]*?)&quot;/g,': <span class="tk-str">"$1"</span>').replace(/: (\d+(\.\d+)?)/g,': <span class="tk-num">$1</span>');}
function runStates(t){
  const plan=runPlan(t),n=plan.length;
  if(t.status==='running'){const i=runIndex(t),frac=Math.min(.9,((Date.now()-t.runStartedAt)-i*runStepMs())/runStepMs());return plan.map((_,k)=>k<i?['done',1]:k===i?['running',(i===n-1?Math.min(frac,.9):frac)]:['pending',0]);}
  if(['review','done'].includes(t.status))return plan.map(()=>['done',1]);
  if(t.status==='wait')return plan.map((_,k)=>k<2?['done',1]:k===2?['waiting',0]:['pending',0]);
  if(t.status==='cancelled'){const i=t.runStopIndex??1;return plan.map((_,k)=>k<i?['done',1]:k===i?['stopped',0]:['pending',0]);}
  return plan.map(()=>['pending',0]);
}
function runView(t,mode='full'){
  if(!t)return '';
  // Plan Card (Kobra): the plan waits for approval before anything runs.
  if(!t.run&&t.status==='pending'){if(mode==='compact')return '';const plan=runPlan(t),all=!!runUIState().plan[t.id],shown=all?plan:plan.slice(0,3);
    return `<section class="as2-run" data-run-task="${t.id}" data-mode="${mode}"><article class="as-plan"><header class="as-plan__head"><span class="as-plan__icon">${ico('task')}</span><h4>${esc(t.title)}</h4></header>${t.goal?`<p class="as-plan__desc">${esc(t.goal)}</p>`:''}<div class="as-plan__todos"><div class="as-plan__todos-head">${ico('task')}<span>执行计划</span><span class="as-num">${plan.length}</span></div><ul>${shown.map(([label])=>`<li><i></i><span>${esc(label)}</span></li>`).join('')}${!all&&plan.length>3?`<li class="as-plan__more"><i></i><span>还有 ${plan.length-3} 项</span></li>`:''}</ul></div><footer class="as-plan__foot"><span class="as-plan__by">${ico('agent')}${esc(t.executor||'CodeAgent')} · 批准后开始执行</span><span class="spacer"></span>${btn(all?'收起计划':'查看计划','run-plan',t.id,'sm')}${btn('批准执行<kbd>⌘</kbd><kbd>↵</kbd>','start-task',t.id,'primary sm')}</footer></article></section>`;}
  const plan=runPlan(t),states=runStates(t),n=plan.length,done=states.filter(x=>x[0]==='done').length,cur=states.findIndex(x=>['running','waiting','stopped'].includes(x[0]));
  const pct=Math.round(states.reduce((a,[st,p])=>a+(st==='done'?1:st==='running'?p:0),0)/n*100);
  const running=t.status==='running',started=t.runStartedAt||Date.now(),runId='R-'+t.id.slice(2)+'-'+(t.run||1);
  const elapsed=running?runClock(Date.now()-started):t.runFinishedAt?runDuration(t.runFinishedAt-started):'';
  const head=running?`<span class="as-thinking" role="status" aria-live="polite"><span class="as-spinner"></span><span class="as-shimmer">正在${esc(plan[cur]?.[0]||'执行')}</span></span>`
    :t.status==='wait'?`<span class="as-status" data-status="waiting">需要你 · ${esc(plan[cur]?.[0]||'确认')}</span>`
    :t.status==='review'?`<span class="as-status" data-status="review">步骤完成 · 待你验收</span>`
    :t.status==='done'?`<span class="as-status" data-status="done">已验收</span>`
    :t.status==='cancelled'?`<span class="as-status" data-status="stopped">已停止 · 停在第 ${cur+1} 步</span>`:'';
  const meta=`<span class="as2-run-meta as-num">${runId}${elapsed?' · '+(running?elapsed:'用时 '+elapsed):''}</span>`;
  // Reasoning Steps (Kobra): once the run settles, the thinking collapses to "已思考 Ns" and can be reopened.
  const reasonOpen=!!runUIState().reason[t.id],thought=!running&&t.runFinishedAt?runDuration(t.runFinishedAt-started):'';
  const reason=!running&&done?`<button class="as-reason" data-a="run-reason" data-v="${t.id}" aria-expanded="${reasonOpen}"><b>已思考</b><span>${thought||done+' 步'}</span>${ico('down')}</button>`:'';
  const reasonSteps=reason&&reasonOpen?`<ol class="as-reason__steps">${plan.slice(0,Math.max(done,1)).map(([label,tool,summary])=>`<li><span>${esc(label)}</span><small>${esc(summary||tool||'')}</small></li>`).join('')}</ol>`:'';
  const stop=running?btn(ico('stop')+'停止','cancel-task',t.id,'sm danger'):'';
  if(mode==='compact')return `<section class="as2-run" data-run-task="${t.id}" data-mode="compact"><div class="as2-run-head">${head}<span class="spacer"></span><span class="as-tasklist__count as-num">${done} / ${n}</span></div><div class="as-progress" ${running?'data-tone="brand"':''}><i style="width:${pct}%"></i></div></section>`;
  const listOpen=!runUIState().closed[t.id];
  const steps=plan.map(([label],k)=>{const [st,p]=states[k];return `<li class="as-tstep" data-state="${st}"><span class="as-tstep__icon" ${st==='running'?`style="--p:${Math.round(p*100)}%"`:''}></span><span class="as-tstep__label">${esc(label)}</span><span class="as-tstep__pct as-num">${st==='running'?Math.round(p*100)+'%':st==='waiting'?'需要你':st==='stopped'?'已停止':''}</span></li>`;}).join('');
  const calls=plan.map((step,k)=>[step,k]).filter(([,k])=>['done','running'].includes(states[k][0])&&plan[k][1]!=='owner.review');
  const times=['1.4s','6.2s','3.8s','12.5s'];
  const tools=calls.map(([[label,tool,summary,input,output],k])=>{const st=states[k][0],key=t.id+'|'+k,open=!!runUIState().open[key];return `<div class="as-tool" data-status="${st==='running'?'running':'success'}" data-open="${open}"><button class="as-tool__head" data-a="run-tool" data-v="${key}" aria-expanded="${open}"><span class="as-tool__tile">${st==='running'?'<span class="as-spinner"></span>':ico('code')}</span><span class="as-tool__name">${esc(tool)}</span><span class="as-tool__summary">${st==='running'?'进行中…':esc(summary)}</span><span class="as-tool__time">${st==='running'?'':times[k]||'2.0s'}</span><span class="as-tool__chev">${ico('chevron')}</span></button><div class="as-tool__body"><div class="as-tool__inner"><div class="as-tool__section"><div class="as-tool__label">输入</div><pre>${runJSON(input)}</pre></div>${st==='running'?'':`<div class="as-tool__section"><div class="as-tool__label">输出</div><pre>${runJSON(output)}</pre></div>`}</div></div></div>`;}).join('');
  return `<section class="as2-run" data-run-task="${t.id}" data-mode="full">
    <div class="as2-run-head">${reason}${head}${meta}<span class="spacer"></span><span class="as-badge as-badge--mock">示例数据</span>${stop}</div>${reasonSteps}
    <div class="as-tasklist" data-open="${listOpen}"><button class="as-tasklist__head" data-a="run-steps" data-v="${t.id}" aria-expanded="${listOpen}"><span class="as-tasklist__ring" data-done="${done===n}"></span><span class="as-tasklist__title">任务</span><span class="as-tasklist__count as-num">${done} / ${n}</span><span class="as-tool__chev">${ico(listOpen?'up':'down')}</span></button>${listOpen?`<ol class="as-tasklist__steps">${steps}</ol>`:''}</div>
    ${tools?`<div class="as-tool-group"><div class="as-tool-group__head">${ico('code')}<span>工具调用 · <span class="as-num">${calls.length}</span> 次</span></div>${tools}</div>`:''}
  </section>`;
}
function runRefresh(){document.querySelectorAll('[data-run-task]').forEach(el=>{const t=s.tasks.find(x=>x.id===el.dataset.runTask);if(t)el.outerHTML=runView(t,el.dataset.mode);});}
function runAction(a,v){
  if(a==='run-tool'){runUIState().open[v]=!runUIState().open[v];runRefresh();return true;}
  if(a==='run-steps'){runUIState().closed[v]=!runUIState().closed[v];runRefresh();return true;}
  if(a==='run-plan'){runUIState().plan[v]=!runUIState().plan[v];runRefresh();return true;}
  if(a==='run-reason'){runUIState().reason[v]=!runUIState().reason[v];runRefresh();return true;}
  return false;
}
setInterval(()=>{if(document.hidden)return;document.querySelectorAll('[data-run-task]').forEach(el=>{const t=s.tasks.find(x=>x.id===el.dataset.runTask);if(t&&t.status==='running')el.outerHTML=runView(t,el.dataset.mode);});},1000);
// ⌘/Ctrl + Enter approves the visible Plan Card (as its button hint says).
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!(e.metaKey||e.ctrlKey))return;const b=[...document.querySelectorAll('.as-plan [data-a="start-task"]')].find(x=>x.getClientRects().length);if(b){e.preventDefault();b.click();}});

// ---- Sidebar motion (Kobra Sidebar: active line · highlight · press · collapse · team switch).
// render() rebuilds #demo, so sidebar affordances are (re)attached by a MutationObserver after each render.
function sidebarState(){return window.__asSidebar||(window.__asSidebar={line:null,collapsed:(()=>{try{return localStorage.getItem('glass-preview-as2-side-collapsed')==='1';}catch(e){return false;}})()});}
function sidebarApplyCollapsed(){document.documentElement.dataset.side=sidebarState().collapsed?'collapsed':'open';}
function sidebarToggle(){const st=sidebarState();st.collapsed=!st.collapsed;try{localStorage.setItem('glass-preview-as2-side-collapsed',st.collapsed?'1':'0');}catch(e){}sidebarApplyCollapsed();}
const SIDEBAR_TOGGLE_ICON=ico('panelLeft');
// Row position in the sidebody's padding box (what an absolutely positioned child is placed against).
function sidebarRowTop(row,body){return Math.round(row.getBoundingClientRect().top-body.getBoundingClientRect().top-body.clientTop+body.scrollTop);}
function sidebarSyncLine(){const body=document.querySelector('#demo .demoside .sidebody'),a=body?.querySelector('.sidenav.active'),line=body?.querySelector(':scope > .as2-nav-line');if(!a||!line)return;const top=sidebarRowTop(a,body);line.style.transform=`translateY(${top}px)`;line.style.height=a.offsetHeight+'px';const st=sidebarState();if(st.line)st.line.top=top;}
function sidebarDecorate(){
  const side=document.querySelector('#demo .demoside'),body=side?.querySelector('.sidebody'),head=side?.querySelector('.sidehead');
  // Collapse toggles: one in the sidebar header, one at the start of the breadcrumb (visible while collapsed).
  if(head&&!head.querySelector('.as2-side-toggle'))head.insertAdjacentHTML('beforeend',`<button class="as2-side-toggle" data-a="side-toggle" aria-label="收起侧栏" title="收起侧栏">${SIDEBAR_TOGGLE_ICON}</button>`);
  const crumb=document.querySelector('#demo .democrumb');
  if(crumb&&side?.children.length&&!crumb.querySelector('.as2-side-toggle'))crumb.insertAdjacentHTML('afterbegin',`<button class="as2-side-toggle as2-side-toggle--crumb" data-a="side-toggle" aria-label="展开侧栏" title="展开侧栏">${SIDEBAR_TOGGLE_ICON}</button>`);
  if(side&&side.children.length&&!side.querySelector(':scope > .as2-side-resizer'))side.insertAdjacentHTML('beforeend','<div class="as2-resizer as2-side-resizer" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度" tabindex="0" title="拖动调整宽度 · 双击恢复默认"></div>');
  if(!body)return;
  // Active line: slides from the previously active row within the same sidebar.
  const active=body.querySelector('.sidenav.active'),key=head?.textContent.trim().slice(0,12)||'';
  let line=body.querySelector(':scope > .as2-nav-line');
  if(active){
    const fresh=!line;
    if(fresh){line=document.createElement('i');line.className='as2-nav-line';line.setAttribute('aria-hidden','true');body.prepend(line);}
    const top=sidebarRowTop(active,body),h=active.offsetHeight,prev=sidebarState().line;
    // A rebuilt sidebar starts from where the line was (same sidebar) or lands in place — never slides in from the top.
    if(fresh&&!(prev&&prev.key===key&&prev.top!==top)){line.style.transition='none';line.style.transform=`translateY(${top}px)`;line.style.height=h+'px';line.getBoundingClientRect();line.style.transition='';}
    else if(prev&&prev.key===key&&prev.top!==top){line.style.transition='none';line.style.transform=`translateY(${prev.top}px)`;line.style.height=prev.h+'px';line.getBoundingClientRect();line.style.transition='';}
    line.style.transform=`translateY(${top}px)`;line.style.height=h+'px';line.style.left=Math.max(0,active.offsetLeft-6)+'px';
    sidebarState().line={key,top,h};
    requestAnimationFrame(()=>requestAnimationFrame(sidebarSyncLine));
  }else if(line)line.remove();
  // Highlight: one hover block that follows the pointer between rows.
  if(!body.querySelector(':scope > .as2-nav-hover')){const hv=document.createElement('i');hv.className='as2-nav-hover';hv.setAttribute('aria-hidden','true');body.prepend(hv);}
}
document.addEventListener('pointerover',e=>{
  const row=e.target.closest('#demo .demoside .sidenav'),body=row?.closest('.sidebody'),hv=body?.querySelector(':scope > .as2-nav-hover');
  if(!hv)return;
  const fresh=hv.dataset.on!=='1';if(fresh){hv.style.transition='none';}
  hv.style.transform=`translateY(${sidebarRowTop(row,body)}px)`;hv.style.height=row.offsetHeight+'px';hv.style.left=row.offsetLeft+'px';hv.style.width=row.offsetWidth+'px';hv.dataset.on='1';
  if(fresh){hv.getBoundingClientRect();hv.style.transition='';}
});
document.addEventListener('pointerout',e=>{
  const body=e.target.closest?.('#demo .demoside .sidebody');if(!body)return;
  if(e.relatedTarget&&e.relatedTarget.closest?.('.sidenav')&&body.contains(e.relatedTarget))return;
  const hv=body.querySelector(':scope > .as2-nav-hover');if(hv)hv.dataset.on='0';
});

// Project switcher popover: anchored under the header switch, Kobra team-switch layout.
function closeProjectSwitcher(){const p=document.querySelector('.as2-switcher');if(!p)return;p.remove();document.querySelector('#demo .projectswitch')?.setAttribute('aria-expanded','false');}
function projectSwitcherItems(q=''){
  const names=orderedProjectNames().filter(n=>n.toLowerCase().includes(q.trim().toLowerCase()));
  return names.map(n=>`<button class="as2-switcher-item" role="option" aria-selected="${n===s.project}" data-a="select-project" data-v="${esc(n)}"><span class="projecticon">${esc(n[0])}</span><span class="as2-switcher-name">${esc(n)}</span>${n===s.project?`<span class="as2-switcher-check">${ico('check')}</span>`:''}</button>`).join('')||'<p class="as2-switcher-empty">没有匹配的项目</p>';
}
function openProjectSwitcher(){
  const btn=document.querySelector('#demo .projectswitch');if(!btn)return false;
  if(document.querySelector('.as2-switcher')){closeProjectSwitcher();return true;}
  const r=btn.getBoundingClientRect();
  document.body.insertAdjacentHTML('beforeend',`<div class="as2-switcher" role="dialog" aria-label="切换项目" style="left:${Math.round(r.left-4)}px;top:${Math.round(r.bottom+4)}px">
    <div class="as2-switcher-search">${ico('search')}<input id="as2SwitcherQuery" placeholder="查找项目" aria-label="查找项目" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="as2-switcher-list" role="listbox">${projectSwitcherItems()}</div>
    <div class="as2-switcher-sep"></div>
    <button class="as2-switcher-item as2-switcher-create" data-a="switcher-create"><span class="as2-switcher-plus">${ico('plus')}</span><span><b>加入或新建项目</b><small>按项目隔离频道、任务、空间与扩展</small></span></button>
  </div>`);
  btn.setAttribute('aria-expanded','true');
  requestAnimationFrame(()=>document.getElementById('as2SwitcherQuery')?.focus({preventScroll:true}));
  return true;
}
document.addEventListener('input',e=>{if(e.target.id==='as2SwitcherQuery'){const list=document.querySelector('.as2-switcher-list');if(list)list.innerHTML=projectSwitcherItems(e.target.value);}});
document.addEventListener('keydown',e=>{
  const pop=document.querySelector('.as2-switcher');if(!pop)return;
  if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeProjectSwitcher();document.querySelector('#demo .projectswitch')?.focus();return;}
  if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const items=[...pop.querySelectorAll('.as2-switcher-item')],i=items.indexOf(document.activeElement);const next=items[(i+(e.key==='ArrowDown'?1:-1)+items.length+(i<0&&e.key==='ArrowUp'?1:0))%items.length];next?.focus();}
  if(e.key==='Enter'&&document.activeElement?.id==='as2SwitcherQuery'){e.preventDefault();pop.querySelector('.as2-switcher-list .as2-switcher-item')?.click();}
},true);
document.addEventListener('pointerdown',e=>{const pop=document.querySelector('.as2-switcher');if(pop&&!pop.contains(e.target)&&!e.target.closest('.projectswitch'))closeProjectSwitcher();},true);
window.addEventListener('resize',closeProjectSwitcher);

// 二级菜单在很多下钻页被 CSS 隐藏但仍在 DOM 里；按是否被隐藏标记 #demo[data-solo]（收起不算隐藏），内容面板据此恢复四角圆角。

sidebarApplyCollapsed();

// Resizable sidebar width (Kobra: 200–360px). Stored per viewer; double-click resets.
const SIDE_MIN=200,SIDE_MAX=360,SIDE_DEFAULT=240;
function sideWidthApply(w){const v=Math.max(SIDE_MIN,Math.min(SIDE_MAX,Math.round(w)));document.documentElement.style.setProperty('--as-side-w',v+'px');return v;}
function sideWidthSave(v){try{localStorage.setItem('glass-preview-as2-side-w',String(v));}catch(e){}}
(()=>{let w=SIDE_DEFAULT;try{w=Number(localStorage.getItem('glass-preview-as2-side-w'))||SIDE_DEFAULT;}catch(e){}sideWidthApply(w);})();
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.as2-side-resizer');if(!h)return;
  e.preventDefault();const side=h.parentElement,left=side.getBoundingClientRect().left;let v=side.getBoundingClientRect().width;
  document.documentElement.dataset.resizing='side';h.setPointerCapture(e.pointerId);
  const move=ev=>{v=sideWidthApply(ev.clientX-left);};
  const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);delete document.documentElement.dataset.resizing;sideWidthSave(v);sidebarSyncLine();};
  h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
});
document.addEventListener('dblclick',e=>{if(e.target.closest('.as2-side-resizer')){sideWidthSave(sideWidthApply(SIDE_DEFAULT));sidebarSyncLine();}});
document.addEventListener('keydown',e=>{

const THREAD_MIN=320,CHANNEL_MIN=360;
function threadWidthApply(px){if(px==null){document.documentElement.style.removeProperty('--as-thread-w');return null;}document.documentElement.style.setProperty('--as-thread-w',Math.round(px)+'px');return Math.round(px);}
function threadWidthSave(v){try{v==null?localStorage.removeItem('glass-preview-as2-thread-w'):localStorage.setItem('glass-preview-as2-thread-w',String(v));}catch(e){}}

function threadClamp(wrap,px){const r=wrap.getBoundingClientRect();return Math.max(THREAD_MIN,Math.min(r.width-CHANNEL_MIN,px));}

  if(a==='board-archive'&&t){modal('归档任务',`<p class="tk-confirm">如若归档，任务将无法恢复继续执行，云上执行任务的沙箱和文件存储将被销毁。可以进入「设置 · 已归档任务」查看执行历史。</p><p class="tk-confirm">请确认是否归档该任务？</p>`,btn('取消','close-modal')+btn('确定','board-archive-confirm',t.id,'primary'));return true;}

image.onload=()=>{const c=document.createElement('canvas');c.width=80;c.height=60;const ctx=c.getContext('2d');const scale=Math.max(innerWidth/image.width,innerHeight/image.height),w=image.width*scale,h=image.height*scale;ctx.drawImage(image,(innerWidth-w)/2*80/innerWidth,(innerHeight-h)/2*60/innerHeight,w*80/innerWidth,h*60/innerHeight);const pixels=ctx.getImageData(0,0,80,60).data;let lum=0,count=0;for(let y=0;y<60;y++)for(let x=0;x<80;x++){if(x>13&&y>6)continue;const i=(y*80+x)*4;const rgb=[pixels[i],pixels[i+1],pixels[i+2]].map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4;});lum+=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];count++;}lum/=count;const black=(lum+.05)/.05,white=1.05/(lum+.05);document.documentElement.style.setProperty('--wallpaper-ink',black>=white?'#000000':'#ffffff');};
new MutationObserver(()=>{cancelAnimationFrame(pending);pending=requestAnimationFrame(sample);}).observe(document.documentElement,{attributes:true,attributeFilter:['style']});sample();})();
</script>
<script>
(()=>{function tidy(){document.querySelectorAll('.demorail button').forEach(b=>{if(b.dataset.railClean)return;const text=[...b.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim();b.setAttribute('aria-label',text||b.getAttribute('aria-label')||b.title);b.removeAttribute('title');[...b.childNodes].filter(n=>n.nodeType===3).forEach(n=>n.remove());b.dataset.railClean='1';});}new MutationObserver(tidy).observe(document.getElementById('demo'),{childList:true,subtree:true});tidy();})();
</script><script>document.documentElement.setAttribute("data-preview-ready","");</script></body></html>
