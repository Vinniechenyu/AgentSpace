<script src="vendor/marked.umd.js"></script>
<script>
(async()=>{
 const article=document.querySelector('#document');
 try{
  const response=await fetch('DESIGN.md');
  if(!response.ok)throw Error('读取失败');
  article.innerHTML=marked.parse(await response.text());
  const toc=document.querySelector('#toc');
  article.querySelectorAll('h2').forEach((heading,i)=>{
   heading.id=`section-${i+1}`;
   const link=document.createElement('a');link.href=`#${heading.id}`;link.textContent=heading.textContent;toc.append(link);
  });
  article.querySelectorAll('table').forEach(table=>{
   const wrapper=document.createElement('div');wrapper.className='table-wrap';wrapper.tabIndex=0;wrapper.setAttribute('role','region');wrapper.setAttribute('aria-label','设计规范表格，可横向滚动');table.before(wrapper);wrapper.append(table);
  });
 }catch{
  article.innerHTML='<div class="error"><p>文档暂时无法加载，请刷新页面重试，或直接下载原文。</p><a href="DESIGN.md" download="design.md">下载 design.md</a></div>';
 }finally{article.setAttribute('aria-busy','false')}
})();
</script>
